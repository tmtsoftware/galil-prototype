# APS multi-controller host configuration (CSW HostConfig).
#
# Brings up all four GalilMotion HCDs, EACH IN ITS OWN PROCESS. HostConfig spawns
# one container process per entry by running the container-cmd script; the
# children inherit HostConfig's working directory (it sets none), so paths below
# resolve relative to wherever you launch the host-config app.
#
# RUN FROM THE REPO ROOT so the relative paths below are clean. The staged
# launchers compute their own app home, so CWD only affects config-file lookup:
#
#   ./target/universal/stage/bin/galil-host-config-app --local \
#     galil-deploy/src/main/resources/GalilApsHostConfig.conf \
#     -s ./target/universal/stage/bin/galil-container-cmd-app
#
# Notes
# - --local tells the host-config app to read THIS file from disk; without it the
#   app fetches it from the Config Service (the default), which is what caused the
#   earlier FileNotFound.
# - galil-host-config-app and galil-container-cmd-app are staged automatically by
#   DeployApp (one script per App object) — no -main, nothing to copy.
# - Do NOT pass -Dgalil.config.path: it is JVM-global. Each HCD derives its
#   per-controller config from its prefix (GalilHcdConfig-APS-N / Config Service
#   APS/ICS/HCD/GalilMotion/N.conf).
# - Start the four simulators first (apsIcsHcdSims.sh start):
#     controller 1 -> 127.0.0.1:8889  HMI 9091
#     controller 2 -> 127.0.0.1:8890  HMI 9092
#     controller 3 -> 127.0.0.1:8891  HMI 9093
#     controller 4 -> 127.0.0.1:8892  HMI 9094

containers: [
  {
    mode: "Container"
    configFilePath: "galil-hcd/src/main/resources/GalilHcd.conf"   # prefix .1
    configFileLocation: "Local"
  },
  {
    mode: "Container"
    configFilePath: "galil-hcd/src/main/resources/GalilHcd2.conf"  # prefix .2
    configFileLocation: "Local"
  },
  {
    mode: "Container"
    configFilePath: "galil-hcd/src/main/resources/GalilHcd3.conf"  # prefix .3
    configFileLocation: "Local"
  },
  {
    mode: "Container"
    configFilePath: "galil-hcd/src/main/resources/GalilHcd4.conf"  # prefix .4
    configFileLocation: "Local"
  }
]

# ===========================================================================
# CONFIG-SERVICE VARIANT (fully CSW-idiomatic — no local paths at all)
#
# Seed the host config and the four container confs into the Config Service, then
# reference them by service path with configFileLocation "Remote". HostConfig
# fetches this file from the service (drop --local), and for each Remote container
# it runs the container script WITHOUT --local so the container app fetches its
# conf from the service too.
#
# Add to scripts/load-config.sh MAP (paths are a suggestion; pick your namespace):
#   "$DEPLOY_RES/GalilApsHostConfig.conf:APS/ICS/deploy/GalilApsHostConfig.conf"
#   "$HCD_RES/GalilHcd.conf:APS/ICS/deploy/GalilHcd1.conf"
#   "$HCD_RES/GalilHcd2.conf:APS/ICS/deploy/GalilHcd2.conf"
#   "$HCD_RES/GalilHcd3.conf:APS/ICS/deploy/GalilHcd3.conf"
#   "$HCD_RES/GalilHcd4.conf:APS/ICS/deploy/GalilHcd4.conf"
#
# Then this block replaces the one above:
#   containers: [
#     { mode: "Container", configFilePath: "APS/ICS/deploy/GalilHcd1.conf", configFileLocation: "Remote" }
#     { mode: "Container", configFilePath: "APS/ICS/deploy/GalilHcd2.conf", configFileLocation: "Remote" }
#     { mode: "Container", configFilePath: "APS/ICS/deploy/GalilHcd3.conf", configFileLocation: "Remote" }
#     { mode: "Container", configFilePath: "APS/ICS/deploy/GalilHcd4.conf", configFileLocation: "Remote" }
#   ]
#
# Launch (from anywhere — no relative paths):
#   galil-host-config-app APS/ICS/deploy/GalilApsHostConfig.conf -s <path>/galil-container-cmd-app
# ===========================================================================