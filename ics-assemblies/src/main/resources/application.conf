include "logging.conf"

pekko {
  loglevel = error
}

startManagement = false

csw-logging {

  # NOTE: no component-log-levels block. The static HOCON block cannot reliably
  # target deeply-nested prefixes like "APS.ICS.STIM.InsertionStage" — the
  # Config.entrySet() key rendering does not round-trip back to the runtime
  # Prefix, so entries silently miss and components fall back to the default
  # logLevel below. (Full analysis: GalilHcd.scala, "KNOWN CSW LIMITATION".)
  # Per-component defaults are instead set at runtime in the handler roots
  # (MotionAssemblyHandlers / DetectorAssemblyHandlers initialize() ->
  # LogAdminUtil.setComponentLogLevel(prefix, INFO)).

  # Default logger level, and the "Gate 2" floor for runtime elevation: a
  # component can be raised to DEBUG at runtime (LogAdminUtil / CSW admin API)
  # only if this global level admits it. Keep at debug.
  logLevel = debug
  slf4jLogLevel = info
  pekkoLogLevel = error

  appenders = ["csw.logging.client.appenders.FileAppender$", "csw.logging.client.appenders.StdOutAppender$"]

  appender-config {
    file {
      # Include standard headers
      fullHeaders = true
      # Sort the fields in Json objects
      sorted = true
      # Base path directory to hold log files from tmt apps. The value is picked
      # from env var `TMT_LOG_HOME`. It is necessary to have `TMT_LOG_HOME` set
      # as env var otherwise an exception will be thrown when FileAppender gets
      # initialized. (Same requirement as the HCD containers; the simulator
      # launcher script also logs under TMT_LOG_HOME.)
      baseLogPath = ${?TMT_LOG_HOME}
      # Directory to hold log files under base path $TMT_LOG_HOME i.e. basePath/logPath
      logPath = ""
      # Common log messages below this level are removed, none removed when set to trace
      logLevelLimit = trace
      # Log file is rotated daily at 12:00 pm UTC when true
      rotate = true
    }
    stdout {
      color = false
      pretty = false
      oneLine = true
      fullHeaders = true
    }
  }
}