// Alarm Store Configuration File (ASCF) for the APS ICS assemblies.
//
// One `hcdFaulted` alarm per motion assembly (16), raised Major by
// MotionAssemblyHandlers while the backing GalilMotion HCD is Faulted and
// cleared to Okay on recovery; severity is kept alive by the assembly's 5s
// refresh timer (see MotionAssemblyHandlers.refreshAlarm). Detector
// assemblies raise no alarms.
//
// Seed into the Alarm Store with scripts/load-alarms.sh (csw-alarm-cli init).
// Format per CSW 6.0.0 csw-alarm valid-alarms.conf.

alarms: [
  {
    prefix = "APS.ICS.APT.FilterWheel"
    name = hcdFaulted
    description = "The GalilMotion HCD backing this assembly is Faulted; the assembly cannot execute motion commands until the HCD recovers"
    location = "APS"
    alarmType = System
    supportedSeverities = [Major]
    probableCause = "Controller connection lost, controller fault, or HCD initialization failure"
    operatorResponse = "Check controller power and network connectivity; recover via the HCD HMI faultReset (None/Init/Reset/Reload). The assembly clears the alarm automatically when the HCD leaves Faulted"
    isAutoAcknowledgeable = true
    isLatchable = false
    activationStatus = Active
  },
  {
