# APS FO&C Calibration Source Stage Assembly — CSW Configuration
# Loaded from the CSW Configuration Service at initialize() (SDD §6.1.4.1).
# Schema per SDD Table 6-1 (Stage Assembly Axis Common Config), Table 6-2
# (recovery retries) and Table 6-9 (Calibration Source Stage specific config).
#
# The Calibration Source Stage controls a single LINEAR axis ("stage", SDD §6.3)
# that places one of several optics/masks onto the optical axis, plus an internal
# calibration light source.
#
# *** MOTION ONLY in this cut ***  Per SDD Figure 2-2 the stage MOTOR is on Galil
# controller 2 (channel F). The light-source control (on/off DIO, output-select
# DIO, voltage AO) is on the controller-3 GPIO and is NOT wired yet — the light
# binding below is recorded for the future RIO work; the assembly's light commands
# are stubs that return Completed without performing any I/O.
#
# *** SIMULATOR BRING-UP VALUES ***  Deliberately made-up, internally consistent
# numbers — NOT calibrated. Resolution 1000 counts/mm; every count value in
# GalilHcdConfig-APS-2.conf (axis F) is the mm value here x 1000. Channel
# assignment is PROVISIONAL (PR-phase confirms).

# ---- Single axis "stage" — keys from SDD Table 6-1 ----
stage {
  countsPerMm  = 1000.0          # 1 count = 1 micron
  isRotational = false

  softwareLimits {
    lower = -100.0               # mm  -> -100000 counts
    upper =  100.0               # mm  ->  100000 counts
  }

  defaultPosition = 0.0          # mm (centre of travel) — moveToDefaultPosition

  galilHcd     = "aps.ICS.HCD.GalilMotion.2"
  galilChannel = "F"             # controller 2, channel F (provisional)

  velocity            = 20.0     # mm/sec    -> 20000 counts/sec
  acceleration        = 100.0    # mm/sec^2  -> 100000 counts/sec^2
  deceleration        = 100.0    # mm/sec^2  -> 100000 counts/sec^2
  indexOffset         = 100.0    # mm        -> 100000 counts (index mark -> position 0)
  indexSpeed          = 2.0      # mm/sec    -> 2000 counts/sec
  inPositionThreshold = 0.01     # mm        -> 10 counts
}

# ---- Optic -> stage slot number (SDD Table 6-9) ----
# Keys MUST match the `optic` ICD choice names (setOptic / setOpticAndSourceIntensity).
opticSlots {
  CALIBRATION_SOURCE = 1
  ZERNIKE1           = 2
  ZERNIKE2           = 3
  FIELD_STOP         = 4
  OPEN               = 5
}

# ---- Stage slot number -> position in mm relative to home zero (SDD Table 6-9) ----
# "The move relative to the home position to place stage slot N on the optical axis."
slotPositions {
  1 = -40.0      # mm — Calibration Source
  2 = -20.0      # mm — Zernike 1
  3 =   0.0      # mm — Zernike 2 (centre)
  4 =  20.0      # mm — Field Stop
  5 =  40.0      # mm — Open
}

# ---- Light source — SPECIFIED, STUBBED (controller-3 GPIO/RIO, SDD Fig 2-2) ----
# NOT wired in this cut. The assembly's light commands (setSourceIntensity and the
# light portion of setOpticAndSourceIntensity) validate, update commanded light
# state for the internalLightStatus telemetry, and return Completed WITHOUT any
# HCD I/O. When RIO support lands, the controller-3 setBit/setAO path and the
# InputOutputState readback will read these addresses.
lightSource {
  hcd                 = "aps.ICS.HCD.GalilMotion.3"  # GPIO/RIO on controller 3 (dashed line, Fig 2-2)
  maxVoltage          = 10.0     # volts representing 100% intensity (SDD Table 6-9)
  onOffAddress        = 1        # DIO bit: source on/off
  outputSelectAddress = 2        # DIO bit: calibration vs stimulus output select
  voltageAddress      = 1        # AO channel: source voltage
}

# ---- Recovery retries — SDD Table 6-2 (<errorName>recoveryRetries) ----
recovery {
  # positionError.recoveryRetries = 2
}