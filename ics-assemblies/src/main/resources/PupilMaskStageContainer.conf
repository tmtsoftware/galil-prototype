# CSW container for the PupilMaskStage assembly — runs it on its own JVM.
# Top-level key is `name` (ContainerInfo), matching the other containers.
name = "PupilMaskStageContainer"

components: [
  {
    prefix = "aps.ICS.STIM.PupilMaskStage"
    componentType = assembly
    componentHandlerClassName = aps.ics.assembly.stim.StimPupilMaskStageHandlers
    locationServiceUsage = RegisterAndTrackServices
    connections = [
      {
        # Galil controller 4 per SDD Figure 2-2. Must match the assembly
        # config axis `galilHcd`.
        prefix: aps.ICS.HCD.GalilMotion.4
        componentType: hcd
        connectionType: pekko
      }
    ]
  }
]
