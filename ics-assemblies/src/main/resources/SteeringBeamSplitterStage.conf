# APS FO&C Steering Beam Splitter Stage Assembly — CSW Configuration
# Loaded from the CSW Configuration Service at initialize() (SDD §6.1.4.1).
# Schema per SDD Table 6-1 (Stage Assembly Axis Common Config) and Table 6-2.
#
# The Steering Beam Splitter controls two LINEAR axes, X and Y (SDD §6.2), on
# Galil controller 2 (channels B and C — the same HCD the Insertion Stage uses).
# The assembly works in user units (mm) and converts to controller counts via
# countsPerMm before commanding the Galil HCD, which deals only in counts.
#
# *** SIMULATOR BRING-UP VALUES ***  Deliberately made-up, internally consistent
# numbers — NOT calibrated. Resolution 1000 counts/mm; every count value in
# GalilHcdConfig-APS-2.conf (axes B/C) is the mm value here x 1000. Channel
# assignment is PROVISIONAL (PR-phase confirms).

# ---- X axis "xStage" — keys from SDD Table 6-1 ----
xStage {
  countsPerMm  = 1000.0          # 1 count = 1 micron
  isRotational = false

  softwareLimits {
    lower = -100.0               # mm  -> -100000 counts
    upper =  100.0               # mm  ->  100000 counts
  }

  defaultPosition = 0.0          # mm (centre of travel) — moveToDefaultPosition

  galilHcd     = "aps.ICS.HCD.GalilMotion.2"
  galilChannel = "B"             # controller 2, channel B (provisional)

  velocity            = 20.0     # mm/sec    -> 20000 counts/sec
  acceleration        = 100.0    # mm/sec^2  -> 100000 counts/sec^2
  deceleration        = 100.0    # mm/sec^2  -> 100000 counts/sec^2
  indexOffset         = 100.0    # mm        -> 100000 counts (index mark to position-0)
  indexSpeed          = 2.0      # mm/sec    -> 2000 counts/sec
  inPositionThreshold = 0.01     # mm        -> 10 counts
}

# ---- Y axis "yStage" — keys from SDD Table 6-1 ----
yStage {
  countsPerMm  = 1000.0
  isRotational = false

  softwareLimits {
    lower = -100.0
    upper =  100.0
  }

  defaultPosition = 0.0

  galilHcd     = "aps.ICS.HCD.GalilMotion.2"
  galilChannel = "C"             # controller 2, channel C (provisional)

  velocity            = 20.0
  acceleration        = 100.0
  deceleration        = 100.0
  indexOffset         = 100.0
  indexSpeed          = 2.0
  inPositionThreshold = 0.01
}

# ---- Recovery retries — SDD Table 6-2 (<errorName>recoveryRetries) ----
recovery {
  # positionError.recoveryRetries = 2
}
