# APS APT Detector Assembly (MOCK) — CSW Configuration
# Loaded from the CSW Configuration Service at initialize() (SDD §5.1.4).
# Schema is the mock subset of SDD Table 5-3 parsed by DetectorConfig.fromConfig.
#
# *** SIMULATOR / MOCK VALUES *** — NOT calibrated. The APT Detector mock has no
# Detector HCD; it manufactures a synthetic frame in memory and publishes it via
# the (stubbed) VBDS image-publisher seam. APT is the acquisition/guiding camera
# (Andor), the one detector whose output is published over VBDS (SDD §5.1.2.2.1).

# Region of interest (pixels). Small by default so synthetic frames are cheap.
defaultRoi {
  startRow = 0
  startCol = 0
  width    = 256
  height   = 256
}

defaultHBin = 1
defaultVBin = 1

# Andor gain mode (configDetector / take* domain): "12-BIT" | "16-BIT"
defaultGainMode = "12-BIT"

# configStatus values (Andor). pixelEncoding ∈ Mono12/Mono12Packed/Mono16/Mono32/Mono12CXP/Mono18
defaultPixelEncoding       = "Mono16"
defaultPixelReadoutRate    = "100MHz"   # "100MHz" | "200MHz"
defaultSpuriousNoiseFilter = false

# Cooling
defaultTemperatureSetPoint = -40.0       # degC
defaultFanSpeed            = "MEDIUM"     # OFF | LOW | MEDIUM | HIGH

# Guiding-loop publish rate (Hz) when streaming.
defaultFrameRate = 10.0

# setupStatus
defaultAcquisitionMode = "SINGLE"        # SINGLE | BURST | LOOP
defaultBufferModel     = "SINGLE"        # SINGLE | CONTAINER | RING
defaultBufferFilename  = "/dev/shm/aps-apt-detector-mock"

apsSharedDiskMountPoint = "/aps/shared/apt"

# VBDS image stream. APT is the sole VBDS publisher (SDD §5.1.2.2.1); it creates
# this stream at initialize() and cannot go READY until the vbds-server confirms
# it. host/port locate the running vbds-server (config, not Location Service).
vbds {
  host        = "192.168.86.20"
  port        = 7778          # must match the running vbds-server HTTP port
  stream      = "APS-APT-ACQ"
  # image/fits (RFC 4047: FITS whose primary HDU is a renderable image), NOT the
  # general application/fits: the esw-vbds webApp gates its JS9 viewer on
  # contentType == "image/fits" (ImageSubscriber.tsx). A stream advertised as
  # application/fits is routed to the JPEG canvas path, which cannot decode FITS.
  contentType = "image/fits"
}