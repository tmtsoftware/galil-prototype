# CSW container for the FiberSourceStage assembly — runs it on its own JVM.
# Top-level key is `name` (ContainerInfo), matching the other containers.
name = "FiberSourceStageContainer"

components: [
  {
    prefix = "aps.ICS.STIM.FiberSourceStage"
    componentType = assembly
    componentHandlerClassName = aps.ics.assembly.stim.StimFiberSourceStageHandlers
    locationServiceUsage = RegisterAndTrackServices
    connections = [
      {
        # Galil controller 4 per SDD Figure 2-2. The light-source DIO/AO is on the same controller but is stubbed this cut. Must match the assembly
        # config axis `galilHcd`.
        prefix: aps.ICS.HCD.GalilMotion.4
        componentType: hcd
        connectionType: pekko
      }
    ]
  }
]
