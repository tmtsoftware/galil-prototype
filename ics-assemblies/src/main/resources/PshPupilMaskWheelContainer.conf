# CSW container for the PshPupilMaskWheel assembly — runs it on its own JVM.
# Top-level key is `name` (ContainerInfo), matching the other containers.
name = "PshPupilMaskWheelContainer"

components: [
  {
    prefix = "aps.ICS.PSH.PupilMaskWheel"
    componentType = assembly
    componentHandlerClassName = aps.ics.assembly.psh.PshPupilMaskWheelHandlers
    locationServiceUsage = RegisterAndTrackServices
    connections = [
      {
        # Galil controller 1 per SDD Figure 2-2 (PSH Pupil Mask Wheel = axis C).
        # Must match the assembly config axis `galilHcd`.
        prefix: aps.ICS.HCD.GalilMotion.1
        componentType: hcd
        connectionType: pekko
      }
    ]
  }
]
