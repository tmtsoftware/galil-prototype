# CSW container hosting ALL ICS assemblies in one JVM, so they start and stop
# together (one process; Ctrl-C / shutdown stops every assembly). Add each new
# assembly's component block here as it comes online.
#
# The HCD(s) these assemblies depend on are started separately (their own
# container, near the hardware in production). Each assembly reads its config
# from the CSW Configuration Service by prefix at initialize().
name = "IcsAssembliesContainer"

components: [
  {
    prefix = "aps.ICS.STIM.InsertionStage"
    componentType = assembly
    componentHandlerClassName = aps.ics.assembly.stim.StimInsertionStageHandlers
    locationServiceUsage = RegisterAndTrackServices
    connections = [
      { prefix: aps.ICS.HCD.GalilMotion.2, componentType: hcd, connectionType: pekko }
    ]
  },
  {
    prefix = "aps.ICS.FOC.SteeringBeamSplitterStage"
    componentType = assembly
    componentHandlerClassName = aps.ics.assembly.foc.FocSteeringBeamSplitterStageHandlers
    locationServiceUsage = RegisterAndTrackServices
    connections = [
      { prefix: aps.ICS.HCD.GalilMotion.2, componentType: hcd, connectionType: pekko }
    ]
  },
  {
    prefix = "aps.ICS.FOC.CollimatorUnit"
    componentType = assembly
    componentHandlerClassName = aps.ics.assembly.foc.FocCollimatorUnitHandlers
    locationServiceUsage = RegisterAndTrackServices
    connections = [
      { prefix: aps.ICS.HCD.GalilMotion.2, componentType: hcd, connectionType: pekko }
    ]
  },
  {
    prefix = "aps.ICS.FOC.CalibrationSourceStage"
    componentType = assembly
    componentHandlerClassName = aps.ics.assembly.foc.FocCalibrationSourceStageHandlers
    locationServiceUsage = RegisterAndTrackServices
    connections = [
      # Controller 2 only (stage motor, channel F). Light-source GPIO is on
      # controller 3 but stubbed this cut, so it is NOT tracked here.
      { prefix: aps.ICS.HCD.GalilMotion.2, componentType: hcd, connectionType: pekko }
    ]
  },
  {
    # SDD §6.6 — single linear axis on controller 1, channel A.
    prefix = "aps.ICS.PSH.FocusStage"
    componentType = assembly
    componentHandlerClassName = aps.ics.assembly.psh.PshFocusStageHandlers
    locationServiceUsage = RegisterAndTrackServices
    connections = [
      { prefix: aps.ICS.HCD.GalilMotion.1, componentType: hcd, connectionType: pekko }
    ]
  },
  {
    # SDD §7.4 — single rotating axis (filterWheel) on controller 1, channel B.
    prefix = "aps.ICS.PSH.FilterWheel"
    componentType = assembly
    componentHandlerClassName = aps.ics.assembly.psh.PshFilterWheelHandlers
    locationServiceUsage = RegisterAndTrackServices
    connections = [
      { prefix: aps.ICS.HCD.GalilMotion.1, componentType: hcd, connectionType: pekko }
    ]
  },
  {
    # SDD §7 (Wheel Assemblies) — single rotating axis (pupilMaskWheel) on controller 1, channel C.
    prefix = "aps.ICS.PSH.PupilMaskWheel"
    componentType = assembly
    componentHandlerClassName = aps.ics.assembly.psh.PshPupilMaskWheelHandlers
    locationServiceUsage = RegisterAndTrackServices
    connections = [
      { prefix: aps.ICS.HCD.GalilMotion.1, componentType: hcd, connectionType: pekko }
    ]
  },
  {
    # SDD §6.7 — single linear axis on controller 1, channel D.
    prefix = "aps.ICS.PIT.FocusStage"
    componentType = assembly
    componentHandlerClassName = aps.ics.assembly.pit.PitFocusStageHandlers
    locationServiceUsage = RegisterAndTrackServices
    connections = [
      { prefix: aps.ICS.HCD.GalilMotion.1, componentType: hcd, connectionType: pekko }
    ]
  },
  {
    # SDD §7 (Wheel Assemblies) — single rotating axis (filterWheel) on controller 1, channel F.
    prefix = "aps.ICS.PIT.FilterWheel"
    componentType = assembly
    componentHandlerClassName = aps.ics.assembly.pit.PitFilterWheelHandlers
    locationServiceUsage = RegisterAndTrackServices
    connections = [
      { prefix: aps.ICS.HCD.GalilMotion.1, componentType: hcd, connectionType: pekko }
    ]
  },
  {
    # SDD §7 (Wheel Assemblies) — single rotating axis (pupilMaskWheel) on controller 1, channel E.
    prefix = "aps.ICS.PIT.PupilMaskWheel"
    componentType = assembly
    componentHandlerClassName = aps.ics.assembly.pit.PitPupilMaskWheelHandlers
    locationServiceUsage = RegisterAndTrackServices
    connections = [
      { prefix: aps.ICS.HCD.GalilMotion.1, componentType: hcd, connectionType: pekko }
    ]
  },
  {
    # SDD §6.8 — single linear axis on controller 3, channel D.
    prefix = "aps.ICS.APT.FocusStage"
    componentType = assembly
    componentHandlerClassName = aps.ics.assembly.apt.AptFocusStageHandlers
    locationServiceUsage = RegisterAndTrackServices
    connections = [
      { prefix: aps.ICS.HCD.GalilMotion.3, componentType: hcd, connectionType: pekko }
    ]
  },
  {
    # SDD §7 (Wheel Assemblies) — single rotating axis (filterWheel) on controller 3, channel E.
    # APT filter wheel has four slots (ND1, ND2, NB589, OPEN).
    prefix = "aps.ICS.APT.FilterWheel"
    componentType = assembly
    componentHandlerClassName = aps.ics.assembly.apt.AptFilterWheelHandlers
    locationServiceUsage = RegisterAndTrackServices
    connections = [
      { prefix: aps.ICS.HCD.GalilMotion.3, componentType: hcd, connectionType: pekko }
    ]
  },
  {
    # SDD §6.5 — two linear axes (X/Y) on controller 3, channels B/C.
    prefix = "aps.ICS.FOC.TiltPlate"
    componentType = assembly
    componentHandlerClassName = aps.ics.assembly.foc.FocTiltPlateHandlers
    locationServiceUsage = RegisterAndTrackServices
    connections = [
      { prefix: aps.ICS.HCD.GalilMotion.3, componentType: hcd, connectionType: pekko }
    ]
  },
  {
    # SDD §8 — single continuous rotating axis (kMirror) on controller 3, channel A.
    prefix = "aps.ICS.FOC.KMirror"
    componentType = assembly
    componentHandlerClassName = aps.ics.assembly.foc.FocKMirrorHandlers
    locationServiceUsage = RegisterAndTrackServices
    connections = [
      { prefix: aps.ICS.HCD.GalilMotion.3, componentType: hcd, connectionType: pekko }
    ]
  },
  {
    # SDD §6.10 — three linear axes (X/Y/Z) on controller 4, channels A/B/C.
    # Light-source DIO/AO is on controller 4 but stubbed this cut, so only the
    # motion HCD is tracked here.
    prefix = "aps.ICS.STIM.FiberSourceStage"
    componentType = assembly
    componentHandlerClassName = aps.ics.assembly.stim.StimFiberSourceStageHandlers
    locationServiceUsage = RegisterAndTrackServices
    connections = [
      { prefix: aps.ICS.HCD.GalilMotion.4, componentType: hcd, connectionType: pekko }
    ]
  },
  {
    # SDD §6.11 — X/Y linear + Phi rotational on controller 4, channels D/E/F.
    prefix = "aps.ICS.STIM.PupilMaskStage"
    componentType = assembly
    componentHandlerClassName = aps.ics.assembly.stim.StimPupilMaskStageHandlers
    locationServiceUsage = RegisterAndTrackServices
    connections = [
      { prefix: aps.ICS.HCD.GalilMotion.4, componentType: hcd, connectionType: pekko }
    ]
  },

  {
    # SDD §5.1 — APT Detector (Andor acquisition/guiding camera) MOCK.
    # No Detector HCD yet: the assembly synthesises frames in memory and
    # publishes via the stubbed VBDS image-publisher. No `connections`.
    prefix = "aps.ICS.APT.Detector"
    componentType = assembly
    componentHandlerClassName = aps.ics.assembly.apt.AptDetectorHandlers
    locationServiceUsage = RegisterAndTrackServices
    connections = []
  },
  {
    # SDD §5.2 — PIT Detector (Teledyne) MOCK. mmap to ICS Computation in the
    # real system; synthetic in-memory frame here. No `connections`.
    prefix = "aps.ICS.PIT.Detector"
    componentType = assembly
    componentHandlerClassName = aps.ics.assembly.pit.PitDetectorHandlers
    locationServiceUsage = RegisterAndTrackServices
    connections = []
  },
  {
    # SDD §5.3 — PSH Detector (Teledyne) MOCK. FITS to APS Shared Disk + DMS in
    # the real system; synthetic in-memory frame here. No `connections`.
    prefix = "aps.ICS.PSH.Detector"
    componentType = assembly
    componentHandlerClassName = aps.ics.assembly.psh.PshDetectorHandlers
    locationServiceUsage = RegisterAndTrackServices
    connections = []
  },
  {
    # ICD sections 21/22 -- ABE Shutter + Enclosure MOCKS (self-contained).
    # The ICD send-model actuates these via HCD setBit (Galil digital outputs),
    # but the output-bit map is not defined yet, so the mocks hold state
    # internally and bind no HCD. No `connections`; no Config Service resource.
    prefix = "aps.ICS.ABE.Shutter"
    componentType = assembly
    componentHandlerClassName = aps.ics.assembly.abe.AbeShutterHandlers
    locationServiceUsage = RegisterAndTrackServices
    connections = []
  },
  {
    prefix = "aps.ICS.ABE.Enclosure"
    componentType = assembly
    componentHandlerClassName = aps.ics.assembly.abe.AbeEnclosureHandlers
    locationServiceUsage = RegisterAndTrackServices
    connections = []
  }
]
