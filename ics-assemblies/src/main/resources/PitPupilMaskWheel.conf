# APS PIT Pupil Mask Wheel Assembly — CSW Configuration
# Loaded from the CSW Configuration Service at initialize() (SDD §7.1.3).
# Schema per SDD Table 7-1 (Wheel Assembly Common Config). The PIT Pupil Mask
# Wheel controls a single ROTATING axis ("pupilMaskWheel", SDD §7 Wheel Assemblies).
#
# Per SDD Figure 2-2 the pupil-mask wheel motor is on Galil controller 1, channel E
# (HCD GalilHcdConfig-APS-1.conf axis E, "pitPupilMaskWheel"). The assembly works in
# user units (degrees) and converts to controller counts via countsPerRevolution
# (counts-per-degree = countsPerRevolution / 360) before commanding the Galil HCD,
# which deals only in counts.
#
# *** SIMULATOR BRING-UP VALUES ***  Deliberately made-up, internally consistent
# numbers — NOT calibrated. countsPerRevolution 360000 -> 1000 counts/deg; every
# degree value here x 1000 equals the matching count value in
# GalilHcdConfig-APS-1.conf axis E. Channel assignment per SDD Figure 2-2.
#
# NOTE: the PIT Pupil Mask Wheel has TWO assigned masks (PH-1-1, Clear).

# ---- Single axis "pupilMaskWheel" — keys from SDD Table 7-1 ----
pupilMaskWheel {
  isRotational                = true
  countsPerRevolution         = 360000        # counts/rev (1000 counts/deg)
  rotationalPositioningMethod = "shortest"     # forward | reverse | shortest (SDD Table 6-1)

  defaultPosition = 1            # default wheel position NUMBER (slot) — moveToDefaultPosition

  galilHcd     = "aps.ICS.HCD.GalilMotion.1"
  galilChannel = "E"            # controller 1, channel E (PIT Pupil Mask Wheel)

  velocity            = 360.0    # deg/sec    -> 360000 counts/sec (1 rev/sec)
  acceleration        = 720.0    # deg/sec^2  -> 720000 counts/sec^2
  deceleration        = 720.0    # deg/sec^2  -> 720000 counts/sec^2
  indexOffset         = 0.0      # deg        -> 0 counts (index mark -> position 0)
  indexSpeed          = 36.0     # deg/sec    -> 36000 counts/sec (0.1 rev/sec)
  inPositionThreshold = 0.1      # deg        -> 100 counts (0.1 deg)

  # ---- Wheel Position N Assignment (SDD Table 7-1) ----
  # Name of the optic in each wheel slot. selectPupilMask(<name>) maps to the slot
  # number below, which goes to the HCD selectWheel command.
  # *** PROVISIONAL ORDER *** mirrors the selectPupilMask enum order; confirm
  # against the actual PIT pupil-mask wheel install / optical model (RD) before
  # operational use.
  positionAssignments {
    "1" = "PH-1-1"
    "2" = "Clear"
  }

  # ---- Detent DIO (SDD §7 detent) — engineering/diagnostic only ----
  # *** DUMMY / PROVISIONAL placeholders *** The detent solenoid and its
  # limit-switch sensors are not yet wired. These are Galil 1-based DIO addresses
  # so commandDetent (setBit -> SB/CB <outputBit>) and the detentState readback
  # (from InputOutputState digital inputs) are exercisable end-to-end before the
  # controller-1 GPIO/RIO wiring is finalised. Confirm/replace before operational
  # use. Distinct from the PSH pupil-mask wheel's placeholder addresses (same
  # controller) to avoid a placeholder DIO collision. detentState reads OUT OF
  # POSITION until the sensor inputs are driven.
  detent {
    outputBit      = 3   # digital OUTPUT: SB/CB <outputBit> extends/retracts the detent
    extendedInput  = 3   # digital INPUT:  true when the detent is fully EXTENDED
    retractedInput = 4   # digital INPUT:  true when the detent is fully RETRACTED
  }
}

# ---- Recovery retries — SDD Table 6-2 (<errorName>recoveryRetries) ----
recovery {
  # positionError.recoveryRetries = 2
}
