# CSW container for the APT Detector assembly (MOCK).
# Top-level key is `name` (ContainerInfo). No `connections`: the mock has no
# Detector HCD — it synthesises frames in memory.
name = "AptDetectorContainer"

components: [
  {
    prefix = "aps.ICS.APT.Detector"
    componentType = assembly
    componentHandlerClassName = aps.ics.assembly.apt.AptDetectorHandlers
    locationServiceUsage = RegisterAndTrackServices
    connections = []
  }
]
