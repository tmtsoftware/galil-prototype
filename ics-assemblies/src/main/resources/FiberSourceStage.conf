# APS Stimulus Fiber Source Stage Assembly — CSW Configuration
# Loaded from the CSW Configuration Service at initialize() (SDD §6.1.4.1).
# Schema per SDD Table 6-1 (Stage Assembly Axis Common Config), Table 6-2
# (recovery retries) and SDD §6.10.2.2 (Fiber Source specific config).
#
# The Fiber Source Stage controls three LINEAR axes, X, Y and Z (SDD §6.10), on
# Galil controller 4 (channels A, B, C per SDD Figure 2-2), plus a fiber light
# source. The assembly works in user units (mm) and converts to controller counts
# via countsPerMm before commanding the Galil HCD, which deals only in counts.
#
# *** MOTION ONLY in this cut ***  Per SDD §6.10 the light source uses DIO
# (on/off, output-select) and an AO (voltage), read back via the HCD
# InputOutputState (§6.10.3.2). That GPIO/RIO path is NOT wired yet, so the light
# binding below is recorded for the future RIO work; the assembly's light command
# (setSourceIntensity) is a stub that returns Completed without performing any I/O.
#
# *** SIMULATOR BRING-UP VALUES ***  Deliberately made-up, internally consistent
# numbers — NOT calibrated. Resolution 1000 counts/mm; every count value in
# GalilHcdConfig-APS-4.conf (axes A/B/C) is the mm value here x 1000. Channel
# assignment is PROVISIONAL (PR-phase confirms).

# ---- X axis "xAxis" (SDD Table 6-26: "X Axis") — keys from SDD Table 6-1 ----
xAxis {
  countsPerMm  = 1000.0          # 1 count = 1 micron
  isRotational = false

  softwareLimits {
    lower = -100.0               # mm  -> -100000 counts
    upper =  100.0               # mm  ->  100000 counts
  }

  defaultPosition = 0.0          # mm (centre of travel) — moveToDefaultPosition

  galilHcd     = "aps.ICS.HCD.GalilMotion.4"
  galilChannel = "A"             # controller 4, channel A (provisional)

  velocity            = 20.0     # mm/sec    -> 20000 counts/sec
  acceleration        = 100.0    # mm/sec^2  -> 100000 counts/sec^2
  deceleration        = 100.0    # mm/sec^2  -> 100000 counts/sec^2
  indexOffset         = 100.0    # mm        -> 100000 counts (index mark -> position 0)
  indexSpeed          = 2.0      # mm/sec    -> 2000 counts/sec
  inPositionThreshold = 0.01     # mm        -> 10 counts
}

# ---- Y axis "yAxis" (SDD Table 6-26: "Y Axis") ----
yAxis {
  countsPerMm  = 1000.0
  isRotational = false

  softwareLimits {
    lower = -100.0
    upper =  100.0
  }

  defaultPosition = 0.0

  galilHcd     = "aps.ICS.HCD.GalilMotion.4"
  galilChannel = "B"             # controller 4, channel B (provisional)

  velocity            = 20.0
  acceleration        = 100.0
  deceleration        = 100.0
  indexOffset         = 100.0
  indexSpeed          = 2.0
  inPositionThreshold = 0.01
}

# ---- Z axis "zAxis" (SDD Table 6-26: "Z Axis") ----
zAxis {
  countsPerMm  = 1000.0
  isRotational = false

  softwareLimits {
    lower = -100.0
    upper =  100.0
  }

  defaultPosition = 0.0

  galilHcd     = "aps.ICS.HCD.GalilMotion.4"
  galilChannel = "C"             # controller 4, channel C (provisional)

  velocity            = 20.0
  acceleration        = 100.0
  deceleration        = 100.0
  indexOffset         = 100.0
  indexSpeed          = 2.0
  inPositionThreshold = 0.01
}

# ---- Light source — SPECIFIED, STUBBED (controller-4 GPIO/RIO, SDD §6.10) ----
# NOT wired in this cut. The assembly's setSourceIntensity command validates,
# updates commanded light state for the internalLightStatus telemetry, and returns
# Completed WITHOUT any HCD I/O. When RIO support lands, the setBit/setAO path and
# the InputOutputState readback will read these addresses (SDD §6.10.2.2).
lightSource {
  hcd                 = "aps.ICS.HCD.GalilMotion.4"  # source DIO/AO on controller 4
  maxVoltage          = 10.0     # volts representing 100% intensity
  onOffAddress        = 1        # DIO bit: source on/off
  outputSelectAddress = 2        # DIO bit: calibration vs stimulus output select
  voltageAddress      = 1        # AO channel: source voltage
}

# ---- Recovery retries — SDD Table 6-2 (<errorName>recoveryRetries) ----
recovery {
  # positionError.recoveryRetries = 2
}
