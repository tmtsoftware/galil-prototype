# APS FO&C Tilt Plate Assembly — CSW Configuration
# Loaded from the CSW Configuration Service at initialize() (SDD §6.1.4.1).
# Schema per SDD Table 6-1 (Stage Assembly Axis Common Config), Table 6-2
# (recovery retries) and Table 6-15 (Tilt Plate specific config).
#
# The Tilt Plate controls two LINEAR axes, X and Y (SDD §6.5), on Galil
# controller 3 (channels B and C per SDD Figure 2-2 — the same HCD as the
# K-Mirror and APT Focus Stage). The assembly works in user units (mm) and
# converts to controller counts via countsPerMm before commanding the Galil HCD.
#
# *** SIMULATOR BRING-UP VALUES ***  Deliberately made-up, internally consistent
# numbers — NOT calibrated. Resolution 1000 counts/mm; every count value in
# GalilHcdConfig-APS-3.conf (axes B/C) is the mm value here x 1000. Channel
# assignment is PROVISIONAL (PR-phase confirms).

# ---- X axis "xAxis" (SDD Table 6-14: "X Stage") — keys from SDD Table 6-1 ----
xAxis {
  countsPerMm  = 1000.0          # 1 count = 1 micron
  isRotational = false

  softwareLimits {
    lower = -100.0               # mm  -> -100000 counts
    upper =  100.0               # mm  ->  100000 counts
  }

  defaultPosition = 0.0          # mm (centre of travel) — moveToDefaultPosition

  galilHcd     = "aps.ICS.HCD.GalilMotion.3"
  galilChannel = "B"             # controller 3, channel B (provisional)

  velocity            = 20.0     # mm/sec    -> 20000 counts/sec
  acceleration        = 100.0    # mm/sec^2  -> 100000 counts/sec^2
  deceleration        = 100.0    # mm/sec^2  -> 100000 counts/sec^2
  indexOffset         = 100.0    # mm        -> 100000 counts (index mark -> position 0)
  indexSpeed          = 2.0      # mm/sec    -> 2000 counts/sec
  inPositionThreshold = 0.01     # mm        -> 10 counts
}

# ---- Y axis "yAxis" (SDD Table 6-14: "Y Stage") — keys from SDD Table 6-1 ----
yAxis {
  countsPerMm  = 1000.0
  isRotational = false

  softwareLimits {
    lower = -100.0
    upper =  100.0
  }

  defaultPosition = 0.0

  galilHcd     = "aps.ICS.HCD.GalilMotion.3"
  galilChannel = "C"             # controller 3, channel C (provisional)

  velocity            = 20.0
  acceleration        = 100.0
  deceleration        = 100.0
  indexOffset         = 100.0
  indexSpeed          = 2.0
  inPositionThreshold = 0.01
}

# ---- Tilt-Plate-specific config — SDD Table 6-15 ----
# Stage->M1 conversion factor per axis: "Converts stage mm to mm at M1", i.e.
#   m1_mm = stage_mm * factor.
# positionTiltPlate commands a PUPIL (M1) translation; the assembly divides the
# demand by this factor to get the stage move (stage_mm = m1_mm / factor).
# *** DIRECTION + VALUES ARE BRING-UP PLACEHOLDERS — confirm in PR phase against
# RD15 / the optical model (same status as the Collimator scale constants). ***
xStageToM1Factor = 0.5           # m1 mm per stage mm (X)
yStageToM1Factor = 0.5           # m1 mm per stage mm (Y)

# ---- Recovery retries — SDD Table 6-2 (<errorName>recoveryRetries) ----
recovery {
  # positionError.recoveryRetries = 2
}
