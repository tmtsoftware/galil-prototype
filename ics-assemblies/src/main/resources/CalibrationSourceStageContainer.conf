# CSW container for the FO&C Calibration Source Stage assembly.
# Top-level key is `name` (ContainerInfo), matching the other containers.
name = "CalibrationSourceStageContainer"

components: [
  {
    prefix = "aps.ICS.FOC.CalibrationSourceStage"
    componentType = assembly
    componentHandlerClassName = aps.ics.assembly.foc.FocCalibrationSourceStageHandlers
    locationServiceUsage = RegisterAndTrackServices
    connections = [
      {
        # Controller 2 only — the STAGE MOTOR (channel F), per SDD Figure 2-2.
        # The light-source GPIO is on controller 3 but is intentionally NOT a
        # tracked connection in this cut: the light path is stubbed, and adding
        # controller 3 here would make the base wait on it (allHcdsConnected)
        # before running startup configure. Must match the assembly config
        # stage `galilHcd`.
        prefix: aps.ICS.HCD.GalilMotion.2
        componentType: hcd
        connectionType: pekko
      }
    ]
  }
]