# APS Stimulus Insertion Stage Assembly — CSW Configuration
# Loaded from the CSW Configuration Service at initialize() (SDD §6.1.4.1).
# Schema per SDD Table 6-1 (Stage Assembly Axis Common Config), Table 6-2
# (recovery retries), and Table 6-24 (InsertionStage-specific config).
#
# The Insertion Stage controls a single LINEAR axis named "stage" (SDD §6.9).
# The assembly works in user units (mm); it converts to controller counts using
# countsPerMm before commanding the Galil HCD, which deals only in counts.
#
# *** SIMULATOR BRING-UP VALUES ***  Deliberately made-up, internally consistent
# numbers — NOT calibrated. Replace with measured values when real motors are
# connected. Resolution is fixed at 1000 counts/mm (1 count = 1 micron); every
# count value in GalilHcdConfig-APS-2.conf is the mm value here x 1000.

# ---- Single axis "stage" — keys from SDD Table 6-1 ----
stage {
  # Resolution: counts per mm of travel (assembly-owned mm<->counts scale).
  countsPerMm = 1000.0          # 1 count = 1 micron

  isRotational = false          # linear stage

  # Absolute soft-limit envelope in mm, in the post-home-zero frame (home zero is
  # the centre of travel per SDD §6.9, so the range is symmetric about 0).
  softwareLimits {
    lower = -100.0              # mm  -> -100000 counts
    upper =  100.0              # mm  ->  100000 counts
  }

  # Default position relative to home zero (mm) — used by moveToDefaultPosition.
  defaultPosition = 0.0         # mm (centre of travel)

  # ---- Assembly -> HCD binding (SDD Table 6-1) ----
  # Controller 2 per SDD Figure 2-2: the Insertion Stage injects into the FO&C
  # path, so it shares controller 2 with the FO&C mechanisms (Steering Beam
  # Splitter, Collimator Unit, Calibration Source Stage) — NOT the stimulus-source
  # controller 4 (Fiber Source / Pupil Mask). Simulated instance: simulate=true
  # lives in the HCD config (GalilHcdConfig-APS-2.conf), not in the name.
  galilHcd     = "aps.ICS.HCD.GalilMotion.2"
  galilChannel = "A"            # provisional channel on controller 2 (PR-phase confirms)

  # ---- Motion config -> HCD configAxis (mm-based; assembly converts to counts) ----
  velocity            = 20.0    # mm/sec     -> 20000 counts/sec
  acceleration        = 100.0   # mm/sec^2   -> 100000 counts/sec^2
  deceleration        = 100.0   # mm/sec^2   -> 100000 counts/sec^2
  indexOffset         = 100.0   # mm         -> 100000 counts (index mark to position-0)
  indexSpeed          = 2.0     # mm/sec     -> 2000 counts/sec (slow index approach)
  inPositionThreshold = 0.01    # mm         -> 10 counts
}

# ---- InsertionStage-specific config — SDD Table 6-24 ----
# Named stage positions (mm) selected by the selectSource command.
stimulusPosition =  60.0        # mm — stimulus light source
skyPosition      = -60.0        # mm — sky light source

# ---- Recovery retries — SDD Table 6-2 (<errorName>recoveryRetries) ----
# PR-phase will define the full set and per-error recovery actions (§6.1.3.3).
recovery {
  # positionError.recoveryRetries = 2
}
