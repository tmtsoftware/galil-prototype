# APS FO&C K-Mirror Assembly — CSW Configuration
# Loaded from the CSW Configuration Service at initialize() (SDD §8.5.1).
# The K-Mirror controls a single CONTINUOUS ROTATING axis ("kMirror", SDD §8).
# Unlike the §7 wheels it is positioned to an arbitrary angle in degrees (no slots),
# so there are no positionAssignments and no detent.
#
# Per SDD Figure 2-2 the K-Mirror motor is on Galil controller 3, channel A
# (HCD GalilHcdConfig-APS-3.conf axis A, "kMirror"). The assembly works in user
# units (degrees) and converts to controller counts via countsPerRevolution
# (counts-per-degree = countsPerRevolution / 360) before commanding the Galil HCD,
# which deals only in counts.
#
# *** SIMULATOR BRING-UP VALUES ***  Deliberately made-up, internally consistent
# numbers — NOT calibrated. countsPerRevolution 360000 -> 1000 counts/deg; every
# degree value here x 1000 equals the matching count value in
# GalilHcdConfig-APS-3.conf axis A. Channel + approach algorithm match that axis.

# ---- Single axis "kMirror" — rotating, continuous ----
kMirror {
  isRotational                = true
  countsPerRevolution         = 360000        # counts/rev (1000 counts/deg)
  rotationalPositioningMethod = "forward"      # forward | reverse | shortest (SDD Table 6-1);
                                               # matches GalilHcdConfig-APS-3.conf axis A algorithm

  defaultPosition = 0.0          # default ANGLE in degrees (home/center) — moveToDefaultPosition

  galilHcd     = "aps.ICS.HCD.GalilMotion.3"
  galilChannel = "A"            # controller 3, channel A (K-Mirror)

  velocity            = 360.0    # deg/sec    -> 360000 counts/sec (1 rev/sec)
  acceleration        = 720.0    # deg/sec^2  -> 720000 counts/sec^2
  deceleration        = 720.0    # deg/sec^2  -> 720000 counts/sec^2
  indexOffset         = 0.0      # deg        -> 0 counts (index mark -> position 0)
  indexSpeed          = 36.0     # deg/sec    -> 36000 counts/sec (0.1 rev/sec)
  inPositionThreshold = 0.1      # deg        -> 100 counts (0.1 deg)

  # ---- Slewing/Tracking demand offset (SDD §8.2.2.2) ----
  # Constant rotation offset from the TCS pupil rotation to the current pupil mask,
  # added to the TCS demand by the Tracking Control Actor.
  # *** PROVISIONAL *** the real value depends on the selected pupil mask / optical
  # model (RD); confirm before operational use.
  maskRotationOffset  = 0.0      # deg

  # ---- Tracking Mode Pupil Rotation in Position Threshold (SDD §8.2.2.4) ----
  # Convergence band: tracking is CONVERGED when |demand - achieved position| is
  # within this. Tighter than the move inPositionThreshold. *** PROVISIONAL ***.
  trackingInPositionThreshold = 0.05   # deg
}

# ---- Recovery retries — SDD Table 6-2 (<errorName>recoveryRetries) ----
recovery {
  # positionError.recoveryRetries = 2
}
