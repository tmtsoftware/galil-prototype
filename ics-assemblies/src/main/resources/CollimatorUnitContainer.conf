# CSW container for the FO&C Collimator Unit assembly.
# Top-level key is `name` (ContainerInfo), matching the other containers.
name = "CollimatorUnitContainer"

components: [
  {
    prefix = "aps.ICS.FOC.CollimatorUnit"
    componentType = assembly
    componentHandlerClassName = aps.ics.assembly.foc.FocCollimatorUnitHandlers
    locationServiceUsage = RegisterAndTrackServices
    connections = [
      {
        # Controller 2 per SDD Figure 2-2 (the Collimator Unit shares the FO&C
        # controller with the Insertion Stage and Steering Beam Splitter). Must
        # match the assembly config frontAxis/rearAxis `galilHcd`.
        prefix: aps.ICS.HCD.GalilMotion.2
        componentType: hcd
        connectionType: pekko
      }
    ]
  }
]