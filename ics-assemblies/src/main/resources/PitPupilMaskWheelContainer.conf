# CSW container for the PitPupilMaskWheel assembly — runs it on its own JVM.
# Top-level key is `name` (ContainerInfo), matching the other containers.
name = "PitPupilMaskWheelContainer"

components: [
  {
    prefix = "aps.ICS.PIT.PupilMaskWheel"
    componentType = assembly
    componentHandlerClassName = aps.ics.assembly.pit.PitPupilMaskWheelHandlers
    locationServiceUsage = RegisterAndTrackServices
    connections = [
      {
        # Galil controller 1 per SDD Figure 2-2 (PIT Pupil Mask Wheel = axis E).
        # Must match the assembly config axis `galilHcd`.
        prefix: aps.ICS.HCD.GalilMotion.1
        componentType: hcd
        connectionType: pekko
      }
    ]
  }
]
