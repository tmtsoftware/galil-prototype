# APS FO&C Collimator Unit Assembly — CSW Configuration
# Loaded from the CSW Configuration Service at initialize() (SDD §6.1.4.1).
# Schema per SDD Table 6-1 (Stage Assembly Axis Common Config), Table 6-2
# (recovery retries) and Table 6-12 (Collimator-specific config).
#
# The Collimator Unit controls two LINEAR axes, Front and Rear (SDD §6.4), on
# Galil controller 2 (channels D and E — the same HCD the Insertion Stage and
# Steering Beam Splitter use). The assembly works in user units (mm) and converts
# to controller counts via countsPerMm before commanding the Galil HCD, which
# deals only in counts.
#
# *** SIMULATOR BRING-UP VALUES ***  Deliberately made-up, internally consistent
# numbers — NOT calibrated. Resolution 1000 counts/mm; every count value in
# GalilHcdConfig-APS-2.conf (axes D/E) is the mm value here x 1000. Channel
# assignment is PROVISIONAL (PR-phase confirms).

# ---- Front axis "frontAxis" — keys from SDD Table 6-1 ----
# Motor moving optics that face the incoming light beam.
frontAxis {
  countsPerMm  = 1000.0          # 1 count = 1 micron
  isRotational = false

  softwareLimits {
    lower = -100.0               # mm  -> -100000 counts
    upper =  100.0               # mm  ->  100000 counts
  }

  defaultPosition = 0.0          # mm (centre of travel) — moveToDefaultPosition

  galilHcd     = "aps.ICS.HCD.GalilMotion.2"
  galilChannel = "D"             # controller 2, channel D (provisional)

  velocity            = 20.0     # mm/sec    -> 20000 counts/sec
  acceleration        = 100.0    # mm/sec^2  -> 100000 counts/sec^2
  deceleration        = 100.0    # mm/sec^2  -> 100000 counts/sec^2
  indexOffset         = 100.0    # mm        -> 100000 counts (index mark -> position 0)
  indexSpeed          = 2.0      # mm/sec    -> 2000 counts/sec
  inPositionThreshold = 0.01     # mm        -> 10 counts
}

# ---- Rear axis "rearAxis" — keys from SDD Table 6-1 ----
# Motor moving optics at the end of the light beam's path through the collimator.
rearAxis {
  countsPerMm  = 1000.0
  isRotational = false

  softwareLimits {
    lower = -100.0
    upper =  100.0
  }

  defaultPosition = 0.0

  galilHcd     = "aps.ICS.HCD.GalilMotion.2"
  galilChannel = "E"             # controller 2, channel E (provisional)

  velocity            = 20.0
  acceleration        = 100.0
  deceleration        = 100.0
  indexOffset         = 100.0
  indexSpeed          = 2.0
  inPositionThreshold = 0.01
}

# ---- Collimator-specific config — SDD Table 6-12 ----
# Maps a 1% pupil-scale change to a motor move (mm) on each axis. changeScale
# multiplies its percentChange argument by these constants to get the per-axis
# move. The two axes use distinct constants so they can be exercised
# independently in the simulator. *** NOT CALIBRATED — placeholder values. ***
frontAxisScaleConstant =  0.5    # mm per 1% scale change (front)
rearAxisScaleConstant  = -0.5    # mm per 1% scale change (rear, opposite sense)

# ---- Recovery retries — SDD Table 6-2 (<errorName>recoveryRetries) ----
recovery {
  # positionError.recoveryRetries = 2
}