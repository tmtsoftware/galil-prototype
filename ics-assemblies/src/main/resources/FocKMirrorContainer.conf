# CSW container for the FocKMirror assembly — runs it on its own JVM.
# Top-level key is `name` (ContainerInfo), matching the other containers.
name = "FocKMirrorContainer"

components: [
  {
    prefix = "aps.ICS.FOC.KMirror"
    componentType = assembly
    componentHandlerClassName = aps.ics.assembly.foc.FocKMirrorHandlers
    locationServiceUsage = RegisterAndTrackServices
    connections = [
      {
        # Galil controller 3 per SDD Figure 2-2 (K-Mirror = axis A). Must match
        # the assembly config axis `galilHcd`.
        prefix: aps.ICS.HCD.GalilMotion.3
        componentType: hcd
        connectionType: pekko
      }
    ]
  }
]
