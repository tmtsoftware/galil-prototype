# CSW container for the Stimulus Insertion Stage assembly.
# Top-level key is `name` (ContainerInfo), matching GalilHcd1.conf — NOT `prefix`.
name = "InsertionStageContainer"

components: [
  {
    prefix = "aps.ICS.STIM.InsertionStage"
    componentType = assembly
    componentHandlerClassName = aps.ics.assembly.stim.StimInsertionStageHandlers
    locationServiceUsage = RegisterAndTrackServices
    connections = [
      {
        # Controller 2 per SDD Figure 2-2 (Insertion Stage shares the FO&C
        # controller). Must match the InsertionStage config `stage.galilHcd`.
        prefix: aps.ICS.HCD.GalilMotion.2
        componentType: hcd
        connectionType: pekko
      }
    ]
  }
]