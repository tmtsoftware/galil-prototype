// Alarm Store Config File (ASCF) for the Stimulus Insertion Stage assembly.
//
// Load into a running Alarm Service before use, e.g.:
//   csw-services start -e -a        # Event + Alarm (Redis) + keycloak
//   csw-admin-cli init InsertionStageAlarms.conf --local
//
// Until this is loaded (and the Alarm Service is running), the assembly's
// setSeverity call fails gracefully and is logged — the assembly still goes
// Faulted on an HCD fault; only the alarm annunciation is absent.
//
// The prefix + name MUST match AlarmKey(assemblyPrefix, "hcdFaulted") in
// StageAssemblyHandlers (assemblyPrefix = the component prefix).

alarms: [
  {
    prefix = "APS.ICS.STIM.InsertionStage"
    name = "hcdFaulted"
    description = "The GalilMotion HCD this assembly depends on is in a Faulted state"
    location = "APS Instrument Cabinet"
    alarmType = Absolute
    supportedSeverities = [Major]
    probableCause = "the Galil motion controller reported a fault, or the HCD lost its connection to the controller"
    operatorResponse = "inspect the GalilMotion HCD / controller; clear the controller fault (HCD HMI). The assembly mirrors out of Faulted automatically once the controller returns to Ready."
    isAutoAcknowledgeable = true
    isLatchable = false
    activationStatus = Active
  }
]
