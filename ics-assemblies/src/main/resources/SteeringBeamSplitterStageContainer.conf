# CSW container for the FO&C Steering Beam Splitter Stage assembly.
# Top-level key is `name` (ContainerInfo), matching the other containers.
name = "SteeringBeamSplitterStageContainer"

components: [
  {
    prefix = "aps.ICS.FOC.SteeringBeamSplitterStage"
    componentType = assembly
    componentHandlerClassName = aps.ics.assembly.steeringbeamsplitter.SteeringBeamSplitterStageHandlers
    locationServiceUsage = RegisterAndTrackServices
    connections = [
      {
        # Controller 2 per SDD Figure 2-2 (the Steering Beam Splitter shares the
        # FO&C controller with the Insertion Stage). Must match the assembly
        # config xStage/yStage `galilHcd`.
        prefix: aps.ICS.HCD.GalilMotion.2
        componentType: hcd
        connectionType: pekko
      }
    ]
  }
]
