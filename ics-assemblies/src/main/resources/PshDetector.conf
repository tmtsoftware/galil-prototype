# APS PSH Detector Assembly (MOCK) — CSW Configuration
# Loaded from the CSW Configuration Service at initialize() (SDD §5.3.4).
#
# *** SIMULATOR / MOCK VALUES *** — NOT calibrated. The PSH Detector mock has no
# Detector HCD; it manufactures a synthetic frame in memory. takeExposure writes
# a FITS file to the APS Shared Disk and emits exposureStoreCompleted; storeExposure
# archives to DMS (exposureArchiveCompleted). No VBDS.

defaultRoi {
  startRow = 0
  startCol = 0
  width    = 256
  height   = 256
}

defaultHBin = 1
defaultVBin = 1

# Teledyne analog gain: LOW | HIGH | HDR
defaultGainMode = "HIGH"

defaultBitDepth    = "16-bit"
defaultShutterMode = "Rolling"
defaultCms         = "OFF"

defaultIntegrationTime = 1.0

defaultTemperatureSetPoint = -30.0
defaultFanSpeed            = "MEDIUM"

defaultFrameRate       = 2.0
defaultAcquisitionMode = "SINGLE"
defaultBufferModel     = "SINGLE"
defaultBufferFilename  = "/dev/shm/aps-psh-detector-mock"

apsSharedDiskMountPoint = "/aps/shared/psh"

vbds {
  stream      = "APS-PSH-RAW"
  contentType = "image/fits"
}
