# CSW container for the AptFilterWheel assembly — runs it on its own JVM.
# Top-level key is `name` (ContainerInfo), matching the other containers.
name = "AptFilterWheelContainer"

components: [
  {
    prefix = "aps.ICS.APT.FilterWheel"
    componentType = assembly
    componentHandlerClassName = aps.ics.assembly.apt.AptFilterWheelHandlers
    locationServiceUsage = RegisterAndTrackServices
    connections = [
      {
        # Galil controller 3 per SDD Figure 2-2 (APT Filter Wheel = axis E). Must
        # match the assembly config axis `galilHcd`.
        prefix: aps.ICS.HCD.GalilMotion.3
        componentType: hcd
        connectionType: pekko
      }
    ]
  }
]
