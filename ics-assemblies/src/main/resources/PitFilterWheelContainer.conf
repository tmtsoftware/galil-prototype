# CSW container for the PitFilterWheel assembly — runs it on its own JVM.
# Top-level key is `name` (ContainerInfo), matching the other containers.
name = "PitFilterWheelContainer"

components: [
  {
    prefix = "aps.ICS.PIT.FilterWheel"
    componentType = assembly
    componentHandlerClassName = aps.ics.assembly.pit.PitFilterWheelHandlers
    locationServiceUsage = RegisterAndTrackServices
    connections = [
      {
        # Galil controller 1 per SDD Figure 2-2 (PIT Filter Wheel = axis F). Must
        # match the assembly config axis `galilHcd`.
        prefix: aps.ICS.HCD.GalilMotion.1
        componentType: hcd
        connectionType: pekko
      }
    ]
  }
]
