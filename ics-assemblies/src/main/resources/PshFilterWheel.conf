# APS PSH Filter Wheel Assembly — CSW Configuration
# Loaded from the CSW Configuration Service at initialize() (SDD §7.1.3).
# Schema per SDD Table 7-1 (Wheel Assembly Common Config). The PSH Filter Wheel
# controls a single ROTATING axis ("filterWheel", SDD §7.4).
#
# Per SDD Figure 2-2 the filter wheel motor is on Galil controller 1, channel B
# (HCD GalilHcdConfig-APS-1.conf axis B, "pshFilterWheel"). The assembly works in
# user units (degrees) and converts to controller counts via countsPerRevolution
# (counts-per-degree = countsPerRevolution / 360) before commanding the Galil HCD,
# which deals only in counts.
#
# *** SIMULATOR BRING-UP VALUES ***  Deliberately made-up, internally consistent
# numbers — NOT calibrated. countsPerRevolution 360000 -> 1000 counts/deg; every
# degree value here x 1000 equals the matching count value in
# GalilHcdConfig-APS-1.conf axis B. Channel assignment per SDD Figure 2-2.

# ---- Single axis "filterWheel" — keys from SDD Table 7-1 ----
filterWheel {
  isRotational                = true
  countsPerRevolution         = 360000        # counts/rev (1000 counts/deg)
  rotationalPositioningMethod = "shortest"     # forward | reverse | shortest (SDD Table 6-1)

  defaultPosition = 1            # default wheel position NUMBER (slot) — moveToDefaultPosition

  galilHcd     = "aps.ICS.HCD.GalilMotion.1"
  galilChannel = "B"            # controller 1, channel B (PSH Filter Wheel)

  velocity            = 360.0    # deg/sec    -> 360000 counts/sec (1 rev/sec)
  acceleration        = 720.0    # deg/sec^2  -> 720000 counts/sec^2
  deceleration        = 720.0    # deg/sec^2  -> 720000 counts/sec^2
  indexOffset         = 0.0      # deg        -> 0 counts (index mark -> position 0)
  indexSpeed          = 36.0     # deg/sec    -> 36000 counts/sec (0.1 rev/sec)
  inPositionThreshold = 0.1      # deg        -> 100 counts (0.1 deg)

  # ---- Wheel Position N Assignment (SDD Table 7-1) ----
  # Name of the optic in each wheel slot. selectFilter(<name>) maps to the slot
  # number below, which goes to the HCD selectWheel command.
  # *** PROVISIONAL ORDER *** mirrors the selectFilter enum order; confirm against
  # the actual PSH filter wheel install / optical model (RD) before operational use.
  positionAssignments {
    "1" = "F890N"
    "2" = "F891N"
    "3" = "F850M"
    "4" = "F750W"
    "5" = "F810N"
    "6" = "F630N"
    "7" = "F865N"
  }
}

# ---- Recovery retries — SDD Table 6-2 (<errorName>recoveryRetries) ----
recovery {
  # positionError.recoveryRetries = 2
}