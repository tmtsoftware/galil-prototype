# CSW container for the PshFilterWheel assembly — runs it on its own JVM.
# Top-level key is `name` (ContainerInfo), matching the other containers.
name = "PshFilterWheelContainer"

components: [
  {
    prefix = "aps.ICS.PSH.FilterWheel"
    componentType = assembly
    componentHandlerClassName = aps.ics.assembly.psh.PshFilterWheelHandlers
    locationServiceUsage = RegisterAndTrackServices
    connections = [
      {
        # Galil controller 1 per SDD Figure 2-2 (PSH Filter Wheel = axis B). Must
        # match the assembly config axis `galilHcd`.
        prefix: aps.ICS.HCD.GalilMotion.1
        componentType: hcd
        connectionType: pekko
      }
    ]
  }
]