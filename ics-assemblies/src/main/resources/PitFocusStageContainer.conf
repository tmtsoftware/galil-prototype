# CSW container for the PitFocusStage assembly — runs it on its own JVM.
# Top-level key is `name` (ContainerInfo), matching the other containers.
name = "PitFocusStageContainer"

components: [
  {
    prefix = "aps.ICS.PIT.FocusStage"
    componentType = assembly
    componentHandlerClassName = aps.ics.assembly.pit.PitFocusStageHandlers
    locationServiceUsage = RegisterAndTrackServices
    connections = [
      {
        # Galil controller 1 per SDD Figure 2-2. Must match the assembly
        # config axis `galilHcd`.
        prefix: aps.ICS.HCD.GalilMotion.1
        componentType: hcd
        connectionType: pekko
      }
    ]
  }
]
