# APS PIT Detector Assembly (MOCK) — CSW Configuration
# Loaded from the CSW Configuration Service at initialize() (SDD §5.2.4).
#
# *** SIMULATOR / MOCK VALUES *** — NOT calibrated. The PIT Detector mock has no
# Detector HCD; it manufactures a synthetic frame in memory. In the real system
# takeExposure hands the frame to ICS Computation via a memory-mapped file (no
# VBDS); the mock just publishes exposure metrics and (for store) a filename.

defaultRoi {
  startRow = 0
  startCol = 0
  width    = 256
  height   = 256
}

defaultHBin = 1
defaultVBin = 1

# Teledyne analog gain (analogGainMode / configStatus analogGain): LOW | HIGH | HDR
defaultGainMode = "HIGH"

# configStatus
defaultBitDepth    = "16-bit"            # 14-bit | 16-bit
defaultShutterMode = "Rolling"           # configStatus domain (command domain is ROLLING/GLOBAL)
defaultCms         = "OFF"               # ON | OFF

# Default integration time (s) reflected in setupStatus until a take* sets it.
defaultIntegrationTime = 0.5

# Cooling
defaultTemperatureSetPoint = -30.0
defaultFanSpeed            = "MEDIUM"

defaultFrameRate       = 5.0
defaultAcquisitionMode = "SINGLE"
defaultBufferModel     = "SINGLE"
defaultBufferFilename  = "/dev/shm/aps-pit-detector-mock"

apsSharedDiskMountPoint = "/aps/shared/pit"

# Present for uniformity; PIT does not publish over VBDS (mmap to ICS Computation).
vbds {
  stream      = "APS-PIT-RAW"
  contentType = "image/fits"
}
