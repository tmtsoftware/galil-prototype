# CSW container for the TiltPlate assembly — runs it on its own JVM.
# Top-level key is `name` (ContainerInfo), matching the other containers.
name = "TiltPlateContainer"

components: [
  {
    prefix = "aps.ICS.FOC.TiltPlate"
    componentType = assembly
    componentHandlerClassName = aps.ics.assembly.foc.FocTiltPlateHandlers
    locationServiceUsage = RegisterAndTrackServices
    connections = [
      {
        # Galil controller 3 per SDD Figure 2-2. Must match the assembly
        # config axis `galilHcd`.
        prefix: aps.ICS.HCD.GalilMotion.3
        componentType: hcd
        connectionType: pekko
      }
    ]
  }
]
