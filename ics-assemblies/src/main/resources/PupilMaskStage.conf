# APS Stimulus Pupil Mask Stage Assembly — CSW Configuration
# Loaded from the CSW Configuration Service at initialize() (SDD §6.1.4.1).
# Schema per SDD Table 6-1 (Stage Assembly Axis Common Config) and Table 6-2
# (recovery retries). The Pupil Mask Stage controls three axes — X, Y (LINEAR)
# and Phi (ROTATIONAL about the optical/z axis) (SDD §6.11) — on Galil controller
# 4 (channels D, E, F per SDD Figure 2-2). There is NO assembly-specific
# configuration (SDD §6.11.2.2: None).
#
# The assembly works in user units (mm for X/Y, deg for Phi) and converts to
# controller counts via countsPerMm before commanding the Galil HCD, which deals
# only in counts.
#
# *** SIMULATOR BRING-UP VALUES ***  Deliberately made-up, internally consistent
# numbers — NOT calibrated. Linear: 1000 counts/mm. Rotational: 1000 counts/deg
# (360000 counts/rev). Every count value in GalilHcdConfig-APS-4.conf (axes
# D/E/F) matches. Channel assignment is PROVISIONAL (PR-phase confirms).

# ---- X axis "xAxis" (SDD Table 6-28: "Stage X") — keys from SDD Table 6-1 ----
xAxis {
  countsPerMm  = 1000.0          # 1 count = 1 micron
  isRotational = false

  softwareLimits {
    lower = -100.0               # mm  -> -100000 counts
    upper =  100.0               # mm  ->  100000 counts
  }

  defaultPosition = 0.0          # mm (centre of travel) — moveToDefaultPosition

  galilHcd     = "aps.ICS.HCD.GalilMotion.4"
  galilChannel = "D"             # controller 4, channel D (provisional)

  velocity            = 20.0     # mm/sec    -> 20000 counts/sec
  acceleration        = 100.0    # mm/sec^2  -> 100000 counts/sec^2
  deceleration        = 100.0    # mm/sec^2  -> 100000 counts/sec^2
  indexOffset         = 100.0    # mm        -> 100000 counts (index mark -> position 0)
  indexSpeed          = 2.0      # mm/sec    -> 2000 counts/sec
  inPositionThreshold = 0.01     # mm        -> 10 counts
}

# ---- Y axis "yAxis" (SDD Table 6-28: "Stage Y") ----
yAxis {
  countsPerMm  = 1000.0
  isRotational = false

  softwareLimits {
    lower = -100.0
    upper =  100.0
  }

  defaultPosition = 0.0

  galilHcd     = "aps.ICS.HCD.GalilMotion.4"
  galilChannel = "E"             # controller 4, channel E (provisional)

  velocity            = 20.0
  acceleration        = 100.0
  deceleration        = 100.0
  indexOffset         = 100.0
  indexSpeed          = 2.0
  inPositionThreshold = 0.01
}

# ---- Phi axis "phiAxis" (SDD Table 6-28: "Stage Phi", ROTATIONAL) ----
# Rotational about the optical (z) axis. isRotational=true makes the base
# configure it via configRotatingAxis using rotationalPositioningMethod as the
# rotation algorithm (forward | reverse | shortest, SDD Table 6-1). countsPerMm
# carries counts-per-DEGREE; all values below are in degrees. Software limits do
# not apply to a rotational axis and are omitted.
phiAxis {
  countsPerMm  = 1000.0          # counts per degree (360000 counts/rev)
  isRotational = true

  rotationalPositioningMethod = "shortest"   # forward | reverse | shortest

  defaultPosition = 0.0          # deg — moveToDefaultPosition

  galilHcd     = "aps.ICS.HCD.GalilMotion.4"
  galilChannel = "F"             # controller 4, channel F (provisional)

  velocity            = 360.0    # deg/sec    -> 360000 counts/sec (1 rev/sec)
  acceleration        = 720.0    # deg/sec^2  -> 720000 counts/sec^2
  deceleration        = 720.0    # deg/sec^2  -> 720000 counts/sec^2
  indexOffset         = 0.0      # deg        -> 0 counts (index mark -> position 0)
  indexSpeed          = 36.0     # deg/sec    -> 36000 counts/sec (0.1 rev/sec)
  inPositionThreshold = 0.1      # deg        -> 100 counts
}

# ---- Recovery retries — SDD Table 6-2 (<errorName>recoveryRetries) ----
recovery {
  # positionError.recoveryRetries = 2
}
