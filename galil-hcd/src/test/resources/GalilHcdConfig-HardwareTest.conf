# GalilMotion HCD Configuration - HARDWARE TEST
# Used by HardwareIntegrationTest
# Points to real Galil controller at 192.168.86.41:23

controller {
  host = [192, 168, 86, 41]
  port = 23
  id = 1
  embeddedProgram = "protoHCD_lab.dmc"
}

simulate = false

activeAxes = [true, true, false, false, false, false, false, false]

axes {
  A {
    mechanismType = "rotating"
    upperLimit = 360.0
    lowerLimit = 0.0
    algorithm = "shortest"
    inPositionThreshold = 1.0
    indexOffset = 0.0
  }
  B {
    mechanismType = "rotating"
    upperLimit = 360.0
    lowerLimit = 0.0
    algorithm = "shortest"
    inPositionThreshold = 1.0
    indexOffset = 0.0
  }
}