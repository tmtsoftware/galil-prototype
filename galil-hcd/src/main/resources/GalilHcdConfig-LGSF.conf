# GalilMotion HCD Configuration - HARDWARE MODE
# Based on SDD Section 4.4, Figure 4-3
#
# Instance-specific hardware parameters for a single Galil DMC-500x0 controller.
# This file does NOT define the CSW prefix or component identity — those are
# the responsibility of the container conf (GalilHcd1.conf), which injects
# componentInfo.prefix via the CSW framework.
#
# Usage:
#   ./target/universal/stage/bin/galil-hcd \
#     -main csw.proto.galil.hcd.GalilHcdApp \
#     --local galil-hcd/src/main/resources/GalilHcd1.conf \
#     -Dgalil.config.path=GalilHcdConfig-LGSF.conf

# Controller connection settings
controller {
  # IP address as integer array [a, b, c, d] for a.b.c.d
  # LGSF controller IP from Galil DMC-4040 / PI M-230.10 commissioning report: 10.0.1.211
  host = [10, 0, 1, 211]
  
  # TCP port for Galil controller
  # Standard Galil telnet port
  port = 23
  
  # Instance id for this HCD (0..N, unique per host). HMI port = 9090 + id.
  # Independent of the CSW prefix, which is set by the container conf.
  id = 1
  
  # Embedded DMC program file (relative to programs.resources directory)
  # Contains #Init, #Setup{A-H} programs and #Version program
  # Version is parsed from DMC file itself
  # This file will be uploaded to the controller during initialization
  embeddedProgram = "lgsfHCD_lab.dmc"
  
  # QR DataRecord polling rates (Hz)
  # Standby: used when all axes are idle/lost/error
  # Action: used when any axis is homing/moving/tracking
  standbyPollingRateHz = 1.0
  actionPollingRateHz = 10.0
}

# Software-only simulation mode
# false: Using real hardware - full validation required
simulate = false

# Active axes (8 boolean values for axes A through H)
# LGSF lab controller has two PI M-230.10 linear actuators on A and B.
activeAxes = [true, true, false, false, false, false, false, false]

# Per-axis configuration
axes {
  # Axis A - PI M-230.10 linear actuator
  # Limits are provisional software margins from the commissioning report after
  # homing the positive-going Hall edge and defining that edge as DP A=0.
  A {
    name = "LGSF-A"              # Human-readable axis name
    mechanismType = "linear"     # Linear axis; positions are raw encoder counts
    algorithm = "forward"        # Linear-axis placeholder; rotating approach algorithms do not apply
    lowerLimit = -600000.0       # counts; software lower travel limit after homing
    upperLimit = 1630000.0       # counts; software upper travel limit after homing
    indexOffset = 0.0            # counts; offset applied after home/index is found
    indexSpeed = 5000.0          # counts/sec; homing search speed for Hall edge
    maxSpeed = 100000.0          # counts/sec; normal operating speed
    acceleration = 100000.0      # counts/sec^2; normal acceleration
    deceleration = 100000.0      # counts/sec^2; normal deceleration
    motionDelay = 100.0          # ms; post-move settling delay
    inPositionThreshold = 100.0  # counts; target tolerance for in-position status
  }

  # Axis B - PI M-230.10 linear actuator
  # Same actuator model and embedded setup as axis A; use the axis-A report
  # values until axis-B-specific travel calibration is measured.
  B {
    name = "LGSF-B"              # Human-readable axis name
    mechanismType = "linear"     # Linear axis; positions are raw encoder counts
    algorithm = "forward"        # Linear-axis placeholder; rotating approach algorithms do not apply
    lowerLimit = -600000.0       # counts; software lower travel limit after homing
    upperLimit = 1630000.0       # counts; software upper travel limit after homing
    indexOffset = 0.0            # counts; offset applied after home/index is found
    indexSpeed = 5000.0          # counts/sec; homing search speed for Hall edge
    maxSpeed = 100000.0          # counts/sec; normal operating speed
    acceleration = 100000.0      # counts/sec^2; normal acceleration
    deceleration = 100000.0      # counts/sec^2; normal deceleration
    motionDelay = 100.0          # ms; post-move settling delay
    inPositionThreshold = 100.0  # counts; target tolerance for in-position status
  }
}
