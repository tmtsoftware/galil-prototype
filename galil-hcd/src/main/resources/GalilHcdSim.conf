# GalilMotion HCD Container Configuration
#
# Generic container configuration for GalilMotion HCD.
# Reusable for all Galil controller instances.
#
# The HCD will load its specific configuration from the Configuration Service
# using the path specified in -Dgalil.config.path system property.
#
# MULTI-INSTANCE DEPLOYMENT:
#   Each physical Galil controller requires its own container conf with a
#   unique prefix (the ".N" suffix is the controller instance number).
#   The prefix here is the authoritative CSW-registered identity for this
#   instance; it is passed to the HCD as componentInfo.prefix by the framework.
#   The galil.config.path property selects the hardware-specific parameters
#   (host, port, axes, etc.) for this instance.
#
#   Instance 1 (this file):
#     prefix = aps.ICS.HCD.GalilMotion.1
#     -Dgalil.config.path=GalilHcdConfig-Hardware.conf
#
#   Instance 2 (GalilHcd2.conf):
#     prefix = aps.ICS.HCD.GalilMotion.2
#     -Dgalil.config.path=GalilHcdConfig-Hardware2.conf
#
# Usage:
#   ./target/universal/stage/bin/galil-hcd \
#     -main csw.proto.galil.hcd.GalilHcdApp \
#     --local galil-hcd/src/main/resources/GalilHcd1.conf \
#     -Dgalil.config.path=GalilHcdConfig-Hardware.conf

name = "GalilHcdContainerSim"

# Program file locations
programs {
  # Directory containing known-good DMC files (in resources, read-only)
  resources = "programs"
  
  # Runtime directory for downloads and backups (read-write)
  # Can be overridden with -Dprograms.runtime=/path/to/dir
  runtime = "programs"
}

# CSW Component registration.
# The prefix here is the sole authoritative source for this instance's
# CSW identity — it is injected into componentInfo.prefix by the framework.
# The GalilHcdConfig-*.conf files do NOT contribute to the prefix.
components: [
  {
    prefix = "aps.ICS.HCD.GalilMotion.Sim"
    componentType = hcd
    componentHandlerClassName = csw.proto.galil.hcd.GalilHcdHandlers
    locationServiceUsage = RegisterOnly
  }
]