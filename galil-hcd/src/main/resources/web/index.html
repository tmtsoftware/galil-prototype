<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GalilMotion HCD — Test Console</title>
<style>
  :root { --mono: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', 'Fira Code', ui-monospace, monospace; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0B0F19; color: #F9FAFB; font-family: system-ui, -apple-system, sans-serif; overflow-x: hidden; overflow-y: auto; }
  ::-webkit-scrollbar { width: 5px; } ::-webkit-scrollbar-thumb { background: #374151; border-radius: 3px; }
  input::placeholder { color: #4B5563; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }
  @keyframes ping { 0%{transform:scale(1);opacity:.4} 100%{transform:scale(2);opacity:0} }
  button:active { transform: scale(0.97); }
</style>
</head>
<body>
<div id="root"><p style="color:#6B7280;padding:20px;font-family:monospace">Loading GalilMotion HMI...</p></div>

<!-- Vendored UMD builds, served by the HCD from resources/web/vendor/ (ADR-002).
     Previously loaded from unpkg.com.  Vendored because this console must run on
     observatory networks with no internet, and because a CDN dependency turns a
     wiring error into silence: prop-types was missing for the entire life of the
     position chart and the only symptom was that the chart never appeared.

     LOAD ORDER IS LOAD-BEARING.  The recharts 2.x UMD build declares prop-types as
     an EXTERNAL, not a bundled dependency -- its factory tail is
     `t.Recharts = e(t.React, t.PropTypes, t.ReactDOM)`.  With no global PropTypes
     the factory throws inside Animate.js and the Recharts global is never assigned.
     react, react-dom and prop-types must all precede Recharts.

     Versions: react 18.3.1, react-dom 18.3.1, prop-types 15.8.1, recharts 2.12.7. -->
<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>
<script src="vendor/prop-types.min.js"></script>
<script src="vendor/Recharts.js"></script>

<script>
'use strict';
const { useState, useEffect, useLayoutEffect, useRef, useCallback, memo } = React;
// Recharts is now vendored and served by the HCD, so its absence is a deployment
// fault, not an environment condition.  The old `hasRecharts` probe silently
// disabled the chart when the library failed to load; it hid a missing prop-types
// dependency indefinitely.  Fail loudly instead -- a blank panel with a reason beats
// a panel that quietly does not exist.
const rechartsError = (typeof Recharts === 'undefined')
  ? 'Recharts failed to load from vendor/Recharts.js (check load order: react, react-dom, prop-types must precede it)'
  : null;
const RC = rechartsError ? {} : Recharts;
const { LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, ReferenceLine } = RC;
const e = React.createElement;

// ── Configuration ──
const CHART_COLORS = {A:'#10B981',B:'#3B82F6',C:'#F59E0B',D:'#EF4444',E:'#8B5CF6',F:'#EC4899',G:'#14B8A6',H:'#F97316'};
const STATE_COLORS = {
  Lost:    {bg:'#374151',text:'#9CA3AF',dot:'#6B7280',bdr:'#4B5563'},
  Idle:    {bg:'#064E3B',text:'#6EE7B7',dot:'#10B981',bdr:'#065F46'},
  Homing:  {bg:'#1E3A5F',text:'#93C5FD',dot:'#3B82F6',bdr:'#1E40AF'},
  Moving:  {bg:'#78350F',text:'#FCD34D',dot:'#F59E0B',bdr:'#92400E'},
  Tracking:{bg:'#164E63',text:'#67E8F9',dot:'#06B6D4',bdr:'#155E75'},
  Error:   {bg:'#7F1D1D',text:'#FCA5A5',dot:'#EF4444',bdr:'#991B1B'},
};

const API_BASE = window.location.origin;
const WS_URL = `ws://${window.location.host}/ws/state`;

// ── Position history accumulation (ADR-002) ──
//
// The HCD records one sample per QR scan into a ring buffer and ships everything
// recorded since the previous push on the EXISTING 4Hz WebSocket tick.  The client
// therefore sees full scan-rate fidelity -- 1Hz at standby, 10Hz during motion --
// without the socket running at 10Hz.  Do not "simplify" this by sampling `state`
// on a browser timer: that is what the previous chart did, and it can only ever
// produce a decimated, jittered copy of data the HCD already holds at full rate.
//
// Columns stay index-aligned with the shared time array.  An axis absent from a
// scan is null, never 0, so an unconfigured axis does not draw a line at the origin.
const HISTORY_CAP_FALLBACK = 3000;

// Mirrors HmiServer.LogRingCapacity, which the HCD replays to a connecting client.
// Sized to what this panel can usefully show: the log list re-renders on every arriving
// line, so retention beyond a panel-sized window buys sluggishness rather than insight.
// The durable record is the CSW log files under TMT_LOG_HOME; this buffer only has to
// survive a page reload. Keep the two constants equal.
const LOG_RETAIN = 1000;

function emptyHistory() {
  return {t: [], axes: {}, nextSeq: 0, gap: false, capacity: 0};
}

function appendPositionSamples(buf, msg) {
  const t = msg.t || [];
  if (!t.length) return false;
  const first = msg.firstSeq, next = msg.nextSeq;
  if (buf.t.length) {
    if (next <= buf.nextSeq) return false;        // wholly covered already
    if (first > buf.nextSeq) buf.gap = true;      // samples lost between frames
  }
  // Trim any overlap instead of duplicating samples onto the trace.
  const skip = buf.t.length ? Math.max(0, Math.min(t.length, buf.nextSeq - first)) : 0;
  const before = buf.t.length;
  for (let i = skip; i < t.length; i++) buf.t.push(t[i]);

  const incoming = msg.axes || {};
  const keys = new Set(Object.keys(buf.axes).concat(Object.keys(incoming)));
  keys.forEach(k => {
    let col = buf.axes[k];
    // An axis seen for the first time is back-filled with nulls so every column
    // stays the same length as `t` and index i always means the same instant.
    if (!col) { col = new Array(before).fill(null); buf.axes[k] = col; }
    const srcCol = incoming[k];
    for (let i = skip; i < t.length; i++) col.push(srcCol ? srcCol[i] : null);
  });

  buf.nextSeq = next;
  if (msg.gap) buf.gap = true;
  if (msg.capacity) buf.capacity = msg.capacity;

  // Mirror the server's retention so the client cannot grow without bound.
  const cap = buf.capacity || HISTORY_CAP_FALLBACK;
  const over = buf.t.length - cap;
  if (over > 0) {
    buf.t.splice(0, over);
    Object.keys(buf.axes).forEach(k => buf.axes[k].splice(0, over));
  }
  return true;
}

// ── WebSocket hook ──
function useHmiConnection() {
  const [state, setState] = useState(null);
  const [connected, setConnected] = useState(false);
  const [logLines, setLogLines] = useState([]);
  // Position history lives in a ref: frames arriving while the plot tab is closed cost
  // nothing but an array push.  `posTick` is bumped only while the plot is mounted, so
  // the 4Hz sample frames do not force a whole-app re-render the rest of the time.
  const posRef = useRef(emptyHistory());
  const [posTick, setPosTick] = useState(0);
  const posLiveRef = useRef(false);
  const setPlotLive = useCallback((on) => { posLiveRef.current = on; }, []);
  const wsRef = useRef(null);
  const reconnectRef = useRef(null);
  // Tracks whether we've ever observed a WS close.  Used to distinguish the
  // initial page-load connect (no reload) from a post-drop reconnect (reload
  // to refresh React state from the new HCD session).  Plain ref rather than
  // useState because it's read inside the WS callbacks without needing to
  // trigger re-renders.
  const hasDisconnectedRef = useRef(false);
  // Per-connection liveness watchdog.  The HCD streams a stateUpdate every
  // 250ms (and log lines whenever they happen), so any silence longer than
  // a couple of seconds means the connection is dead — even if the browser
  // hasn't yet noticed (e.g. the server's TCP socket was closed via Pekko's
  // ServerBinding.terminate(), but the OS-level keep-alive on the client
  // hasn't fired yet, which can take a minute or more).  The watchdog
  // detects this case and force-closes the WS so the existing onclose →
  // reconnect → reload path can run.
  const lastFrameAtRef = useRef(0);
  const watchdogRef = useRef(null);
  const FRAME_TIMEOUT_MS = 3000;
  // Reconnect backoff: start at 2s, double up to a 30s ceiling on each failed
  // connection.  Reset to the floor whenever a connection succeeds.  Without
  // this, a long-term HCD outage (overnight, weekend) leaves the browser tab
  // making a reconnect attempt every 2s indefinitely — wasteful and noisy in
  // DevTools.  At the 30s ceiling we still recover within half a minute when
  // the HCD comes back.
  const reconnectDelayRef = useRef(2000);
  const RECONNECT_DELAY_MIN_MS = 2000;
  const RECONNECT_DELAY_MAX_MS = 30000;

  const connect = useCallback(() => {
    // Centralised reconnect scheduler with exponential backoff.  Each call
    // uses the current delay then doubles it for the next attempt, capped at
    // RECONNECT_DELAY_MAX_MS.  Reset back to the floor inside onmessage when
    // a frame proves the connection is healthy (see below).
    const scheduleReconnect = () => {
      const delay = reconnectDelayRef.current;
      console.log(`WS scheduling reconnect in ${delay}ms`);
      clearTimeout(reconnectRef.current);
      reconnectRef.current = setTimeout(connect, delay);
      reconnectDelayRef.current = Math.min(delay * 2, RECONNECT_DELAY_MAX_MS);
    };

    if (wsRef.current && wsRef.current.readyState < 2) return;
    try {
      const ws = new WebSocket(WS_URL);
      ws.onopen = () => {
        console.log(`WS open: hasDisconnectedRef=${hasDisconnectedRef.current}, readyState=${ws.readyState}`);
        // If we previously disconnected (i.e. this is a *re*-connect, not the
        // initial page-load connect), do a full page reload.  The HCD's
        // Restart action gives us a fresh InternalStateActor with re-initialized
        // axes (un-homed, all flags reset), but React's component state is
        // sticky across the WS drop — even though stateUpdate frames refresh
        // the per-axis fields, derived display state (cfgLoaded, expanded
        // panels, sticky form values) and any field that the new payload
        // happens to omit can show stale data.  A page reload is the cleanest
        // way to get a clean view of the new HCD session.
        //
        // No reload on first connect, since there's no stale state to clear
        // and the existing initial-status fetch handles it.
        if (hasDisconnectedRef.current) {
          console.log('WS reconnected — reloading page to refresh HMI state');
          window.location.reload();
          return;
        }
        setConnected(true);
        // Clear stale log lines from a previous HCD session on every fresh connection.
        // The HCD clears its own state on restart; we mirror that here so the log
        // panel shows only messages from the current session.
        setLogLines([]);
        // Start the liveness watchdog: if no frame arrives within
        // FRAME_TIMEOUT_MS, assume the connection is dead and force-close it.
        // Seed lastFrameAt now so the timeout doesn't fire on connections that
        // are healthy but haven't pushed their first frame yet.
        lastFrameAtRef.current = Date.now();
        if (watchdogRef.current) clearInterval(watchdogRef.current);
        watchdogRef.current = setInterval(() => {
          const silence = Date.now() - lastFrameAtRef.current;
          if (silence > FRAME_TIMEOUT_MS) {
            console.log(`WS watchdog: no frames for ${silence}ms — abandoning connection (readyState=${ws.readyState})`);
            // Stop the watchdog
            clearInterval(watchdogRef.current);
            watchdogRef.current = null;
            // CRITICAL: when the server has done a half-broken close (e.g.
            // pekko-http's ServerBinding.terminate() during JVM Restart), the
            // browser does NOT fire onclose for a client-side ws.close() —
            // observed empirically. So we don't rely on onclose; we do its
            // work directly: mark disconnected, detach handlers from this
            // dead socket, schedule a reconnect.  The old socket will be GC'd
            // (or closed by OS-level keep-alive eventually) — we just stop
            // listening to it.
            try { ws.close(); } catch(_) { /* best-effort */ }
            ws.onopen = null;
            ws.onmessage = null;
            ws.onclose = null;
            ws.onerror = null;
            wsRef.current = null;
            setConnected(false);
            hasDisconnectedRef.current = true;
            console.log('WS watchdog: scheduling reconnect');
            scheduleReconnect();
          }
        }, 1000);
        console.log('WS connected');
      };
      ws.onmessage = (evt) => {
        // Any frame counts as proof of liveness for the watchdog
        lastFrameAtRef.current = Date.now();
        // Healthy frame proves the server is reachable; reset backoff so a
        // future blip starts fresh from the floor instead of inheriting a
        // long delay from a previous outage.
        reconnectDelayRef.current = RECONNECT_DELAY_MIN_MS;
        try {
          const msg = JSON.parse(evt.data);
          if (msg.type === 'stateUpdate') {
            setState(msg);
          } else if (msg.type === 'positionSamples') {
            if (appendPositionSamples(posRef.current, msg) && posLiveRef.current) {
              setPosTick(n => n + 1);
            }
          } else if (msg.type === 'logLine') {
            setLogLines(prev => {
              const next = [...prev, msg];
              // Matches HmiServer.LogRingCapacity, so a reconnecting client keeps
              // exactly what the HCD was willing to replay to it.
              return next.length > LOG_RETAIN ? next.slice(-LOG_RETAIN) : next;
            });
          }
        } catch(e) { console.warn('Bad WS frame', e); }
      };
      ws.onclose = (evt) => {
        console.log(`WS close: code=${evt?.code}, reason='${evt?.reason}', wasClean=${evt?.wasClean}`);
        setConnected(false);
        hasDisconnectedRef.current = true;
        if (watchdogRef.current) {
          clearInterval(watchdogRef.current);
          watchdogRef.current = null;
        }
        scheduleReconnect();
      };
      ws.onerror = (err) => {
        console.log('WS error fired', err);
        ws.close();
      };
      wsRef.current = ws;
    } catch(e) {
      console.error('WS connect error', e);
      scheduleReconnect();
    }
  }, []);

  useEffect(() => {
    // Fetch initial state snapshot via REST
    fetch(`${API_BASE}/api/status`)
      .then(r => r.json()).then(setState)
      .catch(e => console.warn('Initial status fetch failed', e));
    // Backfill the retained position window before the first WebSocket frame, so the
    // plot has history the moment it is opened rather than starting from empty.  This
    // is the whole point of the HCD-side buffer: the browser cannot reconstruct what
    // happened before the page loaded, and the reconnect path reloads the page.
    fetch(`${API_BASE}/api/history`)
      .then(r => r.json())
      .then(h => { if (appendPositionSamples(posRef.current, h)) setPosTick(n => n + 1); })
      .catch(e => console.warn('Position history backfill failed', e));
    connect();
    return () => {
      clearTimeout(reconnectRef.current);
      if (watchdogRef.current) clearInterval(watchdogRef.current);
      if (wsRef.current) wsRef.current.close();
    };
  }, [connect]);

  const submitCommand = useCallback((commandName, params) => {
    console.log(`[DBG] submitCommand: ${commandName}`, params);
    const p = fetch(`${API_BASE}/api/command`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({commandName, params})
    }).then(r => r.json()).then(result => {
      console.log(`[DBG] submitCommand response: ${commandName}`, result);
      return result;
    }).catch(err => {
      console.error(`[DBG] submitCommand FAILED: ${commandName}`, err);
      return {runId:'',status:'Error',message:err.message};
    });
    return p;
  }, []);

  return { state, connected, submitCommand, logLines, posRef, posTick, setPlotLive };
}

// ── Components ──

function StatusDot({axisState}) {
  const c = (STATE_COLORS[axisState]||STATE_COLORS.Lost).dot;
  const pulse = axisState==='Moving'||axisState==='Homing'||axisState==='Tracking';
  const pulseStyle = pulse ? {animation:'pulse 1.2s ease-in-out infinite'} : {};
  return e('span',{style:{position:'relative',display:'inline-flex',alignItems:'center',justifyContent:'center',width:12,height:12,marginRight:5}},
    e('span',{style:Object.assign({width:8,height:8,borderRadius:'50%',backgroundColor:c}, pulseStyle)}),
    pulse ? e('span',{style:{position:'absolute',width:12,height:12,borderRadius:'50%',border:'1.5px solid '+c,opacity:.4,animation:'ping 1.2s ease-in-out infinite'}}) : null
  );
}

function BoolFlag({value,label,trueColor='#10B981',falseColor='#4B5563',enabled,disabledColor='#374151'}) {
  // Tri-state: when `enabled` prop is provided and false, render the disabled color
  // regardless of value (e.g. limit switch not implemented on this axis).
  // When `enabled` is undefined, behaves as a normal two-state flag (back-compat).
  const dotColor = (enabled === false) ? disabledColor : (value ? trueColor : falseColor);
  return e('span',{style:{display:'inline-flex',alignItems:'center',gap:3,fontSize:10.5,color:'#D1D5DB',marginRight:8}},
    e('span',{style:{width:6,height:6,borderRadius:1.5,backgroundColor:dotColor}}),
    label
  );
}

function Btn({label,color,onClick,small}) {
  const [h,setH] = useState(false);
  return e('button',{onClick,onMouseEnter:()=>setH(true),onMouseLeave:()=>setH(false),
    style:{backgroundColor:h?color:`${color}22`,color:h?'#FFF':color,
      border:`1px solid ${color}55`,borderRadius:4,
      padding:small?'2px 8px':'3px 12px',fontSize:small?10.5:11.5,
      fontWeight:600,cursor:'pointer',fontFamily:'var(--mono)',
      transition:'all .12s',whiteSpace:'nowrap'}},label);
}

function In({value,onChange,ph,onEnter,style}) {
  return e('input',{type:'text',value,onChange:ev=>onChange(ev.target.value),
    onKeyDown:ev=>ev.key==='Enter'&&onEnter&&onEnter(),
    placeholder:ph,
    style:{backgroundColor:'#1F2937',border:'1px solid #374151',borderRadius:4,
      padding:'3px 6px',fontSize:11.5,color:'#F9FAFB',fontFamily:'var(--mono)',outline:'none',...style}});
}

function CmdRow({label,value,onChange,ph,onGo,goColor='#10B981'}) {
  return e('div',{style:{display:'flex',gap:4,alignItems:'center',marginTop:4}},
    e('span',{style:{fontSize:10,color:'#6B7280',width:26,fontFamily:'var(--mono)',flexShrink:0}},label),
    e(In,{value,onChange,ph,onEnter:onGo,style:{flex:1}}),
    e(Btn,{label:'Go',color:goColor,small:true,onClick:onGo}));
}

// Two CmdRows side by side on one line — used for Pos + Ofs
function CmdRowPair({label1,value1,onChange1,ph1,onGo1,goColor1='#10B981',
                     label2,value2,onChange2,ph2,onGo2,goColor2='#10B981'}) {
  return e('div',{style:{display:'flex',gap:6,alignItems:'center',marginTop:4}},
    // Left: label + input + Go
    e('span',{style:{fontSize:10,color:'#6B7280',width:26,fontFamily:'var(--mono)',flexShrink:0}},label1),
    e(In,{value:value1,onChange:onChange1,ph:ph1,onEnter:onGo1,style:{flex:1,minWidth:0}}),
    e(Btn,{label:'Go',color:goColor1,small:true,onClick:onGo1}),
    // Divider
    e('span',{style:{color:'#374151',flexShrink:0}},'│'),
    // Right: label + input + Go
    e('span',{style:{fontSize:10,color:'#6B7280',width:26,fontFamily:'var(--mono)',flexShrink:0}},label2),
    e(In,{value:value2,onChange:onChange2,ph:ph2,onEnter:onGo2,style:{flex:1,minWidth:0}}),
    e(Btn,{label:'Go',color:goColor2,small:true,onClick:onGo2}));
}

// Collapsible section toggle label (▸ / ▾)
function ExpandToggle({label, open, onToggle, color='#6B7280'}) {
  return e('div',{
    onClick:onToggle,
    style:{display:'flex',alignItems:'center',gap:4,marginTop:5,cursor:'pointer',
      userSelect:'none',fontSize:10,color,fontFamily:'var(--mono)'}},
    e('span',{style:{fontSize:8,lineHeight:1}}, open ? '▾' : '▸'),
    e('span',null, label));
}

function AxisErrorBar({msg, kind}) {
  if (!msg) return null;
  // 'fault' = genuine controller error (e.g. POSERR, LIMSWI) — red.
  // 'reject' = HMI-side command rejection (e.g. soft-limit violation) — amber,
  //   to signal "the command was refused; the axis itself is fine".
  // Default to 'fault' colouring for back-compat.
  const isReject = kind === 'reject';
  const bg     = isReject ? '#3F2D14' : '#451A1A';
  const border = isReject ? '#F59E0B' : '#EF4444';
  const text   = isReject ? '#FCD34D' : '#FCA5A5';
  const tag    = isReject ? 'REJ' : 'ERR';
  const tagFg  = isReject ? '#FBBF24' : '#F87171';
  return e('div',{style:{backgroundColor:bg,borderRadius:3,padding:'4px 8px',margin:'6px 0 2px',
    fontSize:10.5,color:text,display:'flex',alignItems:'center',gap:5,
    fontFamily:'var(--mono)',borderLeft:`3px solid ${border}`}},
    e('span',{style:{fontWeight:700,fontSize:9.5,color:tagFg}},tag),
    msg);
}

function AxisCard({axis,axState,cmdSt,onCommand,active,compact}) {
  const [posTarget,setPosTarget] = useState('');
  const [offTarget,setOffTarget] = useState('');
  const [wheelPos,setWheelPos] = useState('');
  const [angPos,setAngPos] = useState('');
  const [override,setOverride] = useState(false);
  const [showDemand,setShowDemand] = useState(false);
  // Last HMI-side command rejection for this axis (e.g. soft-limit violation
  // returned synchronously from POST /api/command).  Cleared on the next
  // command from this card.  Server-side axisErrorMsg from a genuine controller
  // error takes precedence over this in the AxisErrorBar display.
  const [rejectMsg,setRejectMsg] = useState('');

  if (!axState) return null;
  const enabled = active || override;
  const colors = STATE_COLORS[axState.axisState] || STATE_COLORS.Lost;
  const cs = cmdSt || {};
  const dim = enabled ? 1 : 0.35;

  // Dispatch a command and toggle demand visibility:
  // positionAxis and offsetAxis show demand; all other commands hide it.
  // Captures HMI-side synchronous rejections (e.g. soft-limit violations) into
  // rejectMsg so the user sees why the command did nothing — the calling
  // assembly would see the same message in its own response, but the HMI
  // bypasses the assembly and submits direct to the HCD.  Server-side errors
  // (genuine controller faults) flow through axisErrorMsg and override this.
  const cmd = (name, extra={}) => {
    if (!enabled) return;
    if (name === 'positionAxis' || name === 'offsetAxis' || name === 'positionWheel') setShowDemand(true);
    else setShowDemand(false);
    setRejectMsg('');  // clear stale rejection when a new command is issued
    const p = onCommand(name, {axis, ...extra});
    if (p && typeof p.then === 'function') {
      p.then(result => {
        if (result && result.status === 'Error' && result.message) {
          setRejectMsg(result.message);
        }
      });
    }
  };

  // Collapsed view for inactive axes — just a slim header strip, click INACTIVE to expand
  if (!active && !override) {
    return e('div',{style:{backgroundColor:'#0D1117',border:'1px solid #1F2937',
        borderRadius:8,overflow:'hidden',borderTop:'2px solid #1F2937'}},
      e('div',{style:{padding:'5px 12px',display:'flex',justifyContent:'space-between',alignItems:'center'}},
        e('span',{style:{display:'flex',alignItems:'baseline',gap:6}},
          e('span',{style:{fontFamily:'var(--mono)',fontWeight:600,fontSize:10,color:'#4B5563',letterSpacing:1.2}},`AXIS ${axis}`),
          axState?.axisName
            ? e('span',{style:{fontFamily:'var(--mono)',fontWeight:700,fontSize:12,color:'#4B5563'}}, axState.axisName)
            : null),
        e('span',{style:{fontSize:8.5,color:'#4B5563',cursor:'pointer',
            padding:'2px 6px',borderRadius:3,border:'1px solid #27303f',userSelect:'none'},
            onClick:()=>setOverride(true),title:'Click to enable commands on this axis'},
          'INACTIVE')));
  }

  return e('div',{style:{backgroundColor:'#111827',border:`1px solid ${enabled?colors.bdr:'#1F2937'}`,
    borderRadius:8,overflow:'hidden',minWidth:280,borderTop:`3px solid ${enabled?colors.dot:'#374151'}`,
    opacity:enabled?1:0.85, position:'relative',display:'flex',flexDirection:'column'}},

    // Header
    e('div',{style:{backgroundColor:enabled?colors.bg:'#0D1117',padding:'7px 12px',display:'flex',justifyContent:'space-between',alignItems:'center',position:'relative'}},
      e('span',{style:{display:'flex',alignItems:'baseline',gap:6}},

// ── Tracking Telemetry Panel ─────────────────────────────────────────
// Renders when axisState === Tracking.  Self-updating 4Hz via state push.
function TrackingTelemetry({axState}) {
  const ts = axState.trackingSession;
  if (!ts) return null;

  // Compute age of lastValidTime vs now (negative when lastValidTime is in the future,
  // which is the normal case for a fresh trackAxis — validTime is ~1 sec ahead).
  // Display sign-corrected: positive means "past", negative means "future".
  const now = Date.now();
  const lvtMs = new Date(ts.lastValidTime).getTime();
  const btMs  = new Date(ts.btFiredAt).getTime();
  const ageSec = (now - lvtMs) / 1000;
  const elapsedSec = (now - btMs) / 1000;

  // Heartbeat color: green within ±1.5s of zero, yellow approaching 2s, red past 2s.
  // The hard controller cap is T ≤ 2,048 samples ≈ 2.048s at TM=1000.
  const ageAbs = Math.abs(ageSec);
  const ageColor = ageAbs < 1.5 ? '#10B981' : ageAbs < 2.0 ? '#F59E0B' : '#EF4444';

  // FIFO occupancy: _PV is free slots (255 = empty buffer); occupancy = 255 - _PV.
  // _BT is segments executed since the last BT.
  const fifoUsed = 255 - (axState.pvFreeSlots ?? 255);
  const depth    = (ts.segmentsSubmitted ?? 0) - (axState.btSegmentsExecuted ?? 0);

  // Format helpers — keep numbers compact in the row.
  const fmtSec = s => (s >= 0 ? '+' : '') + s.toFixed(2) + 's';
  const fmtElapsed = s => {
    if (s < 60) return s.toFixed(1) + 's';
    const m = Math.floor(s / 60), r = s % 60;
    return m + 'm' + r.toFixed(0) + 's';
  };

  const rowStyle = {display:'flex',gap:10,alignItems:'baseline',fontSize:10.5,
                   fontFamily:'var(--mono)',color:'#9CA3AF'};
  const labelStyle = {color:'#6B7280',fontSize:9.5};
  const valStyle = {color:'#E5E7EB'};

  return e('div',{style:{marginTop:3,padding:'4px 7px',backgroundColor:'#0B2738',
                         borderRadius:4,borderLeft:'2px solid #06B6D4',
                         display:'flex',flexDirection:'column',gap:2}},
    // Row 1: session ledger (submitted, target, age)
    e('div',{style:rowStyle},
      e('span',{style:labelStyle},'TRK'),
      e('span',null,
        e('span',{style:labelStyle},'seg '),
        e('span',{style:valStyle}, ts.segmentsSubmitted)),
      e('span',{style:{color:'#374151'}},'\u2502'),
      e('span',null,
        e('span',{style:labelStyle},'tgt '),
        e('span',{style:valStyle}, ts.lastTargetCounts)),
      e('span',{style:{color:'#374151'}},'\u2502'),
      e('span',null,
        e('span',{style:labelStyle},'age '),
        e('span',{style:{color:ageColor,fontWeight:600}}, fmtSec(ageSec))),
      e('span',{style:{flex:1}}),
      e('span',null,
        e('span',{style:labelStyle},'run '),
        e('span',{style:valStyle}, fmtElapsed(elapsedSec)))),
    // Row 2: controller FIFO (_PV, _BT, depth)
    e('div',{style:rowStyle},
      e('span',{style:labelStyle},'FIFO'),
      e('span',null,
        e('span',{style:labelStyle},'used '),
        e('span',{style:valStyle}, fifoUsed),
        e('span',{style:labelStyle}, '/255')),
      e('span',{style:{color:'#374151'}},'\u2502'),
      e('span',null,
        e('span',{style:labelStyle},'exec '),
        e('span',{style:valStyle}, axState.btSegmentsExecuted ?? 0)),
      e('span',{style:{color:'#374151'}},'\u2502'),
      e('span',null,
        e('span',{style:labelStyle},'depth '),
        e('span',{style:{color: depth <= 0 ? '#EF4444' : depth < 2 ? '#F59E0B' : '#10B981'}},
          depth))));
}

function AxisVisual({axState, colors, showDemand}) {
  if (!axState) return null;
  const isRotating = axState.mechanismType === 'Rotating' && axState.countsPerRevolution > 0;

  if (isRotating) {
    // ── Rotating dial ── 76×76
    const angDeg = axState.angularPosition || 0;
    const demandDeg = axState.countsPerRevolution > 0
      ? ((axState.demand / axState.countsPerRevolution * 360) % 360 + 360) % 360
      : null;
    const toRad = d => (d - 90) * Math.PI / 180;
    const cx = 38, cy = 38, r = 30, rNeedle = 23, rDemand = 27;
    const nx = cx + rNeedle * Math.cos(toRad(angDeg));
    const ny = cy + rNeedle * Math.sin(toRad(angDeg));
    const dx = demandDeg != null ? cx + rDemand * Math.cos(toRad(demandDeg)) : null;
    const dy = demandDeg != null ? cy + rDemand * Math.sin(toRad(demandDeg)) : null;
    const ticks = [0, 90, 180, 270];
    const tickLabels = ['0', '90', '180', '270'];

    const dial = e('svg', {width:76, height:76, style:{flexShrink:0}},
      e('circle', {cx, cy, r, fill:'none', stroke:'#1F2937', strokeWidth:2}),
      e('circle', {cx, cy, r:r-2, fill:'#0D1117'}),
      ...ticks.map((t, i) => {
        const ra = toRad(t);
        const x1 = cx + (r-2) * Math.cos(ra), y1 = cy + (r-2) * Math.sin(ra);
        const x2 = cx + (r-8) * Math.cos(ra), y2 = cy + (r-8) * Math.sin(ra);
        const lx = cx + (r-16) * Math.cos(ra), ly = cy + (r-16) * Math.sin(ra);
        return [
          e('line', {key:'tk'+i, x1, y1, x2, y2, stroke:'#374151', strokeWidth:1.5}),
          e('text', {key:'tl'+i, x:lx, y:ly, textAnchor:'middle', dominantBaseline:'middle',
            fontSize:9, fill:'#4B5563', fontFamily:'var(--mono)'}, tickLabels[i])
        ];
      }).flat(),
      dx != null && showDemand ? e('line', {x1:cx, y1:cy, x2:dx, y2:dy,
        stroke:'#93C5FD', strokeWidth:1.5, strokeDasharray:'3 2', opacity:.5}) : null,
      e('line', {x1:cx, y1:cy, x2:nx, y2:ny,
        stroke:colors.dot, strokeWidth:2, strokeLinecap:'round'}),
      e('circle', {cx, cy, r:3, fill:colors.dot})
    );

    // Angle label beside the dial
    const angleLabel = e('div',{style:{display:'flex',flexDirection:'column',justifyContent:'center',
        alignItems:'flex-start',paddingLeft:4,fontFamily:'var(--mono)'}},
      e('span',{style:{fontSize:9,color:'#6B7280',marginBottom:2}},'Angle'),
      e('span',{style:{fontSize:13,fontWeight:700,color:'#A78BFA',fontVariantNumeric:'tabular-nums'}},
        angDeg.toFixed(1)+'\u00b0'),
      showDemand && demandDeg != null
        ? e('span',{style:{fontSize:9,color:'#93C5FD',fontVariantNumeric:'tabular-nums',marginTop:2}},
            '\u21d2 '+demandDeg.toFixed(1)+'\u00b0')
        : null);

    return e('div',{style:{display:'flex',alignItems:'center',flexShrink:0}}, dial, angleLabel);
  } else {
    // ── Linear track ── wide/short, motion left→right; lo/hi labels below the rail
    const pos    = axState.position || 0;
    const lo     = axState.lowerLimit != null ? axState.lowerLimit : 0;
    const hi     = axState.upperLimit != null ? axState.upperLimit : 1000;
    const demand = axState.demand || 0;
    const W = 252, H = 56;
    const padL = 8, padR = 8;
    const trackY = 22;
    const clamp  = v => Math.max(0, Math.min(1, (v - lo) / (hi - lo || 1)));
    const posX   = padL + clamp(pos)    * (W - padL - padR);
    const demX   = padL + clamp(demand) * (W - padL - padR);
    const inPos  = axState.inPosition;
    const indColor = inPos ? '#10B981' : colors.dot;

    return e('svg', {width:'100%', viewBox:`0 0 ${W} ${H}`, style:{display:'block',marginTop:4}},
      e('line', {x1:padL, y1:trackY, x2:W-padR, y2:trackY,
        stroke:'#374151', strokeWidth:2, strokeLinecap:'round'}),
      e('line', {x1:padL, y1:trackY-4, x2:padL, y2:trackY+4, stroke:'#4B5563', strokeWidth:1.5}),
      e('line', {x1:W-padR, y1:trackY-4, x2:W-padR, y2:trackY+4, stroke:'#4B5563', strokeWidth:1.5}),
      // lo/hi labels below the rail, left/right justified within track width
      e('text', {x:padL, y:trackY+18, textAnchor:'start', dominantBaseline:'auto',
        fontSize:10, fill:'#6B7280', fontFamily:'var(--mono)'}, lo.toFixed(0)),
      e('text', {x:W-padR, y:trackY+18, textAnchor:'end', dominantBaseline:'auto',
        fontSize:10, fill:'#6B7280', fontFamily:'var(--mono)'}, hi.toFixed(0)),
      showDemand ? e('line', {x1:demX, y1:trackY-9, x2:demX, y2:trackY+9,
        stroke:'#93C5FD', strokeWidth:1.5, strokeDasharray:'3 2', opacity:.6}) : null,
      e('line', {x1:posX, y1:trackY-11, x2:posX, y2:trackY+11,
        stroke:indColor, strokeWidth:2, strokeLinecap:'round'}),
      e('circle', {cx:posX, cy:trackY, r:4.5, fill:indColor}),
      e('text', {x:posX, y:trackY-14, textAnchor:'middle', dominantBaseline:'auto',
        fontSize:9.5, fill:'#F9FAFB', fontFamily:'var(--mono)', fontWeight:700},
        pos.toFixed(0))
    );
  }
}


function CpuBadge({cpu}) {
  if (!cpu) return null;
  const proc = cpu.processCpuLoad, sys = cpu.systemCpuLoad;
  const pct = proc >= 0 ? proc*100 : null;
  const sysPct = sys >= 0 ? sys*100 : null;
  const fmt = v => v == null ? '\u2014' : v.toFixed(0) + '%';
  // Thresholds keyed off REQ-2-APS-0621's 70% ceiling: green < 55, amber 55-70, red >= 70.
  const col = pct == null ? '#6B7280' : pct >= 70 ? '#FCA5A5' : pct >= 55 ? '#FCD34D' : '#6EE7B7';
  const bg  = pct != null && pct >= 70 ? '#7F1D1D' : pct != null && pct >= 55 ? '#78350F' : '#1F2937';
  return e('span',{
    title:`This HCD JVM CPU load vs REQ-2-APS-0621 (target <= 70%) \u2014 process ${fmt(pct)} \u00B7 system ${fmt(sysPct)} \u00B7 ${cpu.availableProcessors} logical cores`,
    style:{display:'inline-flex',alignItems:'center',gap:4,fontSize:9.5,padding:'2px 7px',borderRadius:3,
      backgroundColor:bg,color:col,fontFamily:'var(--mono)',fontWeight:700}},
    e('span',{style:{width:5,height:5,borderRadius:'50%',backgroundColor:col,flexShrink:0}}),
    `CPU ${fmt(pct)}`);
}

function ThreadStatusBar({threadStatus}) {
  if (!threadStatus) return null;
  return e('div',{style:{display:'flex',gap:2,alignItems:'center',fontFamily:'var(--mono)',fontSize:9.5,color:'#6B7280'}},
