# GalilMotion HCD Configuration — APS Galil Controller 4 (SIMULATOR)
#
# Controller-to-mechanism assignment per APS-ICS SDD Figure 2-2 (REL02 p.22).
# Controllers are numbered 1-4, each dedicated to one Galil controller; the CSW
# identity (aps.ICS.HCD.GalilMotion.4) comes from the container conf, not here.
# Select at launch with -Dgalil.config.path=GalilHcdConfig-APS-4.conf
#
# Controller 4 hosts (6 motion channels per Figure 2-2):
#   Fiber Source Assembly (X, Y, Z) + Pupil Mask Assembly (x, y, rotation)
#   (the other Stimulus-group mechanisms; light-source GPIO shared per Fig 2-2)
#
# *** SIMULATOR SCAFFOLD — assemblies for this controller are not built yet, so
# no axes are active. Activate axes and add per-axis blocks as each assembly
# comes online. ***

controller {
  host = [127, 0, 0, 1]
  port = 8888
  id = 4
  embeddedProgram = "galil_embedded_v1.dmc"
  standbyPollingRateHz = 1.0
  actionPollingRateHz  = 10.0
}

simulate = true

# No axes active yet (scaffold). 8 booleans, A-H.
activeAxes = [false, false, false, false, false, false, false, false]

axes {
  # Per-axis blocks added as assemblies are brought up.
}
