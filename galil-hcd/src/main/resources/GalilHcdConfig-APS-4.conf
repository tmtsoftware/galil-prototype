# GalilMotion HCD Configuration — APS Galil Controller 4 (SIMULATOR)
#
# Controller 4 — Stimulus Fiber Source + Pupil Mask mechanisms.
# Controller-to-mechanism assignment per APS-ICS SDD Figure 2-2 (REL02 p.22).
# The CSW identity (aps.ICS.HCD.GalilMotion.4) comes from the container conf, not here.
#
#   A-F (6 motion channels per Figure 2-2):
#     A Fiber Source X (linear)    D Pupil Mask x (linear)
#     B Fiber Source Y (linear)    E Pupil Mask y (linear)
#     C Fiber Source Z (linear)    F Pupil Mask rotation (rotating)
#     (Fiber Source light-source DIO/AO is I/O, not a motion channel.)
#
# *** SIMULATOR VALUES — NOT CALIBRATED ***  All axis numbers are controller COUNTS.
# Linear axes use the live Insertion-Stage template (1000 counts/mm); rotating axes
# use 360000 counts/rev (1000 counts/deg). Channel assignments are PROVISIONAL
# (PR-phase confirms). The assembly owns mm<->counts; the HCD deals only in counts.

controller {
  host = [127, 0, 0, 1]
  port = 8892        # simulator endpoint = 8888 + id (one sim per controller)
  id = 4
  embeddedProgram = "galil_embedded_v1.dmc"
  standbyPollingRateHz = 1.0
  actionPollingRateHz  = 10.0
}

simulate = true

# 8 booleans, A-H. Active channels for this controller's mechanisms.
activeAxes = [true, true, true, true, true, true, false, false]

axes {
  A =
    {
      name                = "fiberSourceX"
      mechanismType       = "linear"
      algorithm           = "forward"
      lowerLimit          = -100000.0   # counts (-100 mm)
      upperLimit          = 100000.0   # counts (100 mm)
      indexOffset         = 100000.0   # counts (index mark -> position 0)
      indexSpeed          = 2000.0     # counts/sec
      maxSpeed            = 20000.0    # counts/sec
      acceleration        = 100000.0   # counts/sec^2
      deceleration        = 100000.0   # counts/sec^2
      inPositionThreshold = 10.0       # counts (0.01 mm)
    }
  B =
    {
      name                = "fiberSourceY"
      mechanismType       = "linear"
      algorithm           = "forward"
      lowerLimit          = -100000.0   # counts (-100 mm)
      upperLimit          = 100000.0   # counts (100 mm)
      indexOffset         = 100000.0   # counts (index mark -> position 0)
      indexSpeed          = 2000.0     # counts/sec
      maxSpeed            = 20000.0    # counts/sec
      acceleration        = 100000.0   # counts/sec^2
      deceleration        = 100000.0   # counts/sec^2
      inPositionThreshold = 10.0       # counts (0.01 mm)
    }
  C =
    {
      name                = "fiberSourceZ"
      mechanismType       = "linear"
      algorithm           = "forward"
      lowerLimit          = -100000.0   # counts (-100 mm)
      upperLimit          = 100000.0   # counts (100 mm)
      indexOffset         = 100000.0   # counts (index mark -> position 0)
      indexSpeed          = 2000.0     # counts/sec
      maxSpeed            = 20000.0    # counts/sec
      acceleration        = 100000.0   # counts/sec^2
      deceleration        = 100000.0   # counts/sec^2
      inPositionThreshold = 10.0       # counts (0.01 mm)
    }
  D =
    {
      name                = "pupilMaskX"
      mechanismType       = "linear"
      algorithm           = "forward"
      lowerLimit          = -100000.0   # counts (-100 mm)
      upperLimit          = 100000.0   # counts (100 mm)
      indexOffset         = 100000.0   # counts (index mark -> position 0)
      indexSpeed          = 2000.0     # counts/sec
      maxSpeed            = 20000.0    # counts/sec
      acceleration        = 100000.0   # counts/sec^2
      deceleration        = 100000.0   # counts/sec^2
      inPositionThreshold = 10.0       # counts (0.01 mm)
    }
  E =
    {
      name                = "pupilMaskY"
      mechanismType       = "linear"
      algorithm           = "forward"
      lowerLimit          = -100000.0   # counts (-100 mm)
      upperLimit          = 100000.0   # counts (100 mm)
      indexOffset         = 100000.0   # counts (index mark -> position 0)
      indexSpeed          = 2000.0     # counts/sec
      maxSpeed            = 20000.0    # counts/sec
      acceleration        = 100000.0   # counts/sec^2
      deceleration        = 100000.0   # counts/sec^2
      inPositionThreshold = 10.0       # counts (0.01 mm)
    }
  F =
    {
      name                = "pupilMaskRotation"
      mechanismType       = "rotating"
      algorithm           = "shortest"   # forward | reverse | shortest (SDD Table 6-1)
      countsPerRevolution = 360000.0   # counts/rev (1000 counts/deg)
      indexOffset         = 0.0        # counts (index mark -> position 0)
      indexSpeed          = 36000.0    # counts/sec (0.1 rev/sec)
      maxSpeed            = 360000.0   # counts/sec (1 rev/sec)
      acceleration        = 720000.0   # counts/sec^2
      deceleration        = 720000.0   # counts/sec^2
      inPositionThreshold = 100.0      # counts (0.1 deg)
    }
}
