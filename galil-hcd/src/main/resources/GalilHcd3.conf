# GalilMotion HCD Container — APS Galil Controller 3
# Registers CSW identity aps.ICS.HCD.GalilMotion.3. The HCD derives its
# per-instance config from this prefix (last segment "3"):
#   Config Service:  APS/ICS/HCD/GalilMotion/3.conf
#   offline fallback: GalilHcdConfig-APS-3.conf
# Do NOT pass -Dgalil.config.path here — that property is JVM-global and is only
# for single-HCD-per-JVM runs. Under host config each container is its own
# process, and prefix-derivation selects the right file.

name = "GalilHcdContainer3"

programs {
  resources = "programs"
  runtime   = "programs"
}

components: [
  {
    prefix = "aps.ICS.HCD.GalilMotion.3"
    componentType = hcd
    componentHandlerClassName = csw.proto.galil.hcd.GalilHcdHandlers
    locationServiceUsage = RegisterOnly
  }
]
