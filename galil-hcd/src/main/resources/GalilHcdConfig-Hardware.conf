# GalilMotion HCD Configuration - HARDWARE MODE
# Based on SDD Section 4.4, Figure 4-3
#
# Instance-specific hardware parameters for a single Galil DMC-500x0 controller.
# This file does NOT define the CSW prefix or component identity — those are
# the responsibility of the container conf (GalilHcd1.conf), which injects
# componentInfo.prefix via the CSW framework.
#
# Usage:
#   ./target/universal/stage/bin/galil-hcd \
#     -main csw.proto.galil.hcd.GalilHcdApp \
#     --local galil-hcd/src/main/resources/GalilHcd1.conf \
#     -Dgalil.config.path=GalilHcdConfig-Hardware.conf

# Controller connection settings
controller {
  # IP address as integer array [a, b, c, d] for a.b.c.d
  # Physical controller IP: 192.168.86.41
  host = [192, 168, 86, 41]
  
  # TCP port for Galil controller
  # Standard Galil telnet port
  port = 23
  
  # Instance id for this HCD (0..N, unique per host). HMI port = 9090 + id.
  # Independent of the CSW prefix, which is set by the container conf.
  id = 1
  
  # Embedded DMC program file (relative to programs.resources directory)
  # Contains #Init, #Setup{A-H} programs and #Version program
  # Version is parsed from DMC file itself
  # This file will be uploaded to the controller during initialization
  embeddedProgram = "protoHCD_lab.dmc"
  
  # QR DataRecord polling rates (Hz)
  # Standby: used when all axes are idle/lost/error
  # Action: used when any axis is homing/moving/tracking
  standbyPollingRateHz = 1.0
  actionPollingRateHz = 10.0
}

# Software-only simulation mode
# false: Using real hardware - full validation required
simulate = false

# Active axes (8 boolean values for axes A through H)
# Physical controller has two rotating stepper motors on A and B
activeAxes = [true, true, false, false, false, false, false, false]

# Per-axis configuration
axes {
  # Axis A - Rotating Stepper Motor
  A {
    # Mechanism type: "linear" or "rotating"
    # This is a rotating mechanism
    mechanismType = "rotating"

    # Upper soft limit (degrees for rotating)
    # Full rotation: 0-360 degrees
    upperLimit = 360.0

    # Lower soft limit (degrees)
    lowerLimit = 0.0

    # Approach algorithm for positioning commands
    # "shortest": Take shortest path for rotating mechanisms
    algorithm = "shortest"

    # In-position threshold (degrees)
    inPositionThreshold = 1.0

    # Offset applied after homing (encoder counts)
    indexOffset = 0.0

    # counts/revolution — mechanical constant from embedded #SetupA (cpd[0]=1.13)
    countsPerRevolution = 400   # counts per full revolution

    # Motion parameters — written to embedded variables at HCD init (Tier 2 authority)
    # Source: protoHCD_lab.dmc #SetupA: SPA=1000, ACA=9216, DCA=9216
    maxSpeed     = 1000.0   # counts/sec
    acceleration = 9216.0   # counts/sec²
    deceleration = 9216.0   # counts/sec²
    motionDelay  = 100.0    # ms (post-move settling)
    indexSpeed   = 256.0    # counts/sec (homing speed)
  }

  # Axis B - Rotating Stepper Motor
  B {
    mechanismType = "rotating"
    upperLimit = 360.0
    lowerLimit = 0.0
    algorithm = "shortest"
    inPositionThreshold = 1.0
    indexOffset = 0.0

    # counts/revolution — mechanical constant from embedded #SetupB (cpd[1]=1.13)
    countsPerRevolution = 400   # counts per full revolution

    # Motion parameters — written to embedded variables at HCD init (Tier 2 authority)
    # Source: protoHCD_lab.dmc #SetupB: SPB=1000, ACB=9216, DCB=9216
    maxSpeed     = 1000.0   # counts/sec
    acceleration = 9216.0   # counts/sec²
    deceleration = 9216.0   # counts/sec²
    motionDelay  = 100.0    # ms (post-move settling)
    indexSpeed   = 256.0    # counts/sec (homing speed)
  }
}