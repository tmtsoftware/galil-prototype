# GalilMotion HCD Container — APS Galil Controller 2
# Registers CSW identity aps.ICS.HCD.GalilMotion.2. Pair with:
#   -Dgalil.config.path=GalilHcdConfig-APS-2.conf
# (Instances 1/3/4 use GalilHcd.conf / GalilHcd3.conf / GalilHcd4.conf with the
#  matching GalilHcdConfig-APS-N.conf.)

name = "GalilHcdContainer2"

programs {
  resources = "programs"
  runtime   = "programs"
}

components: [
  {
    prefix = "aps.ICS.HCD.GalilMotion.2"
    componentType = hcd
    componentHandlerClassName = csw.proto.galil.hcd.GalilHcdHandlers
    locationServiceUsage = RegisterOnly
  }
]
