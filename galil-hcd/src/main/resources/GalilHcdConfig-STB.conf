# GalilMotion HCD Configuration - HARDWARE MODE
# Based on SDD Section 4.4, Figure 4-3
#
# Instance-specific hardware parameters for a single Galil DMC-500x0 controller.
# This file does NOT define the CSW prefix or component identity — those are
# the responsibility of the container conf (GalilHcd.conf), which injects
# componentInfo.prefix via the CSW framework.
#
# Usage:
#   ./target/universal/stage/bin/galil-hcd \
#     -main csw.proto.galil.hcd.GalilHcdApp \
#     --local galil-hcd/src/main/resources/GalilHcd.conf \
#     -Dgalil.config.path=GalilHcdConfig-Hardware.conf

# Controller connection settings
controller {
  # IP address as integer array [a, b, c, d] for a.b.c.d
  # STB in Monrovia controller IP: 192.168.42.100
  host = [192, 168, 42, 100]
  
  # TCP port for Galil controller
  # Standard Galil telnet port
  port = 23
  
  # Instance identifier for this Galil controller (1-N)
  id = 1
  
  # Embedded DMC program file (relative to resources/programs directory)
  # Contains #Init, #Setup{A-H} programs, etc
  # During initialization, this file will be verified on the controller and uploaded if not correct
  embeddedProgram = "galilHCD_STB.dmc"
  
  # QR DataRecord polling rates (Hz)
  # Standby: used when all axes are idle/lost/error
  # Action: used when any axis is homing/moving/tracking
  standbyPollingRateHz = 1.0
  actionPollingRateHz = 10.0
}

# Software-only simulation mode
simulate = false

# Active axes (8 boolean values for axes A through H)
activeAxes = [true, true, true, true, true, true, true, false]

# Per-axis configuration
axes {
  # Axis A - ANT linear stage
  # Single axis linear translation stage
  A {
    name = "ANT"
    mechanismType = "linear"
    upperLimit = 22459
    lowerLimit = -60000
    inPositionThreshold = 3.0
    # Motion parameters 
    indexOffset = 0.0
    maxSpeed     = 20000.0   # counts/sec
    acceleration = 256000.0   # counts/sec²
    deceleration = 256000.0   # counts/sec²
    motionDelay  = 300.0    # ms (post-move settling)
    indexSpeed   = 256.0    # counts/sec (homing speed)
  }
  # Axis B - ATS linear stage
  # Pupil mask X (horizontal) positioning stage
  B {
    name = "ATS"
    mechanismType = "linear"
    upperLimit = 4132343
    lowerLimit = -35352
    inPositionThreshold = 3.0
    # Motion parameters 
    indexOffset = 0.0
    maxSpeed     = 20000.0   # counts/sec
    acceleration = 256000.0   # counts/sec²
    deceleration = 256000.0   # counts/sec²
    motionDelay  = 200.0    # ms (post-move settling)
    indexSpeed   = 256.0    # counts/sec (homing speed)
  }
  # Axis C - AVS vertical linear stage
  # Pupil mask Y (vertical) positioning
  C {
    name = "AVS"
    mechanismType = "linear"
    upperLimit = 392144
    lowerLimit = -1536
    inPositionThreshold = 3.0
    # Motion parameters 
    indexOffset = 0.0
    maxSpeed     = 20000.0   # counts/sec
    acceleration = 256000.0   # counts/sec²
    deceleration = 256000.0   # counts/sec²
    motionDelay  = 200.0    # ms (post-move settling)
    indexSpeed   = 256.0    # counts/sec (homing speed)
  }
  # Axis D - ALAR rotating stage
  # Pupil mask ? (rotation) positioning
  D {
    name = "ALAR"
    mechanismType = "rotating"
    algorithm = "shortest"
    inPositionThreshold = 3.0
    # Motion parameters 
    indexOffset = 0
    countsPerRevolution = 629760   # counts per full revolution
    maxSpeed     = 50000.0   # counts/sec
    acceleration = 256000.0   # counts/sec²
    deceleration = 256000.0   # counts/sec²
    motionDelay  = 100.0    # ms (post-move settling)
    indexSpeed   = 256.0    # counts/sec (homing speed)
  }
  # Axis E - FPS-X linear stage
  # X-axis of a three-axis linear platform for fiber-source positioning
  E {
    name = "FPS-X"
    mechanismType = "linear"
    upperLimit = 195000
    lowerLimit = -100
    inPositionThreshold = 1.0
    # Motion parameters
    indexOffset = 0
    maxSpeed     = 10000.0   # counts/sec
    acceleration = 256000.0   # counts/sec²
    deceleration = 256000.0   # counts/sec²
    motionDelay  = 100.0    # ms (post-move settling)
    indexSpeed   = 256.0    # counts/sec (homing speed)
  }
  # Axis F - FPS-Y linear stage
  # Y-axis of a three-axis linear platform for fiber-source positioning
  F {
    name = "FPS-Y"
    mechanismType = "linear"
    upperLimit = 195000
    lowerLimit = -100
    inPositionThreshold = 1.0
    # Motion parameters
    indexOffset = 0
    maxSpeed     = 10000.0   # counts/sec
    acceleration = 256000.0   # counts/sec²
    deceleration = 256000.0   # counts/sec²
    motionDelay  = 100.0    # ms (post-move settling)
    indexSpeed   = 256.0    # counts/sec (homing speed)
  }
  # Axis G - FPS-Z linear stage
  # Z-axis of a three-axis linear platform for fiber-source positioning
  G {
    name = "FPS-Z"
    mechanismType = "linear"
    upperLimit = 195000
    lowerLimit = -100
    inPositionThreshold = 1.0
    # Motion parameters
    indexOffset = 0
    maxSpeed     = 10000.0   # counts/sec
    acceleration = 256000.0   # counts/sec²
    deceleration = 256000.0   # counts/sec²
    motionDelay  = 100.0    # ms (post-move settling)
    indexSpeed   = 256.0    # counts/sec (homing speed)
  }
}