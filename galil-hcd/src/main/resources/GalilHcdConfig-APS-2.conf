# GalilMotion HCD Configuration — APS Galil Controller 2 (SIMULATOR)
#
# Controller-to-mechanism assignment per APS-ICS SDD Figure 2-2 (REL02 p.22).
# Controllers are numbered 1-4, each dedicated to one Galil controller; the CSW
# identity (aps.ICS.HCD.GalilMotion.2) comes from the container conf, not here.
# Select at launch with -Dgalil.config.path=GalilHcdConfig-APS-2.conf
#
# Controller 2 hosts (6 motion channels per Figure 2-2):
#   Steering Beam Splitter Stage, Collimator Unit, Calibration Source Stage,
#   and the Stimulus Insertion Stage (it injects into the FO&C path, so it shares
#   this controller with the FO&C mechanisms rather than the stimulus-source ones).
#
# *** SIMULATOR VALUES — NOT CALIBRATED ***  Axis A = the Insertion Stage, the
# only mechanism brought up so far. All axis numbers are controller counts at a
# fixed 1000 counts/mm (1 count = 1 micron); each value is the assembly's mm
# value x 1000. Channels B-D are reserved for the FO&C mechanisms above and stay
# inactive until those assemblies are built (PR-phase channel assignment).

controller {
  host = [127, 0, 0, 1]
  port = 8888
  id = 2                          # APS Galil controller 2
  embeddedProgram = "galil_embedded_v1.dmc"
  standbyPollingRateHz = 1.0
  actionPollingRateHz  = 10.0
}

simulate = true

# Only axis A (Insertion Stage) active for now.
activeAxes = [true, false, false, false, false, false, false, false]

axes {
  # Axis A — Stimulus Insertion Stage (provisional channel; PR-phase confirms)
  A {
    name                = "stage"
    mechanismType       = "linear"
    algorithm           = "forward"
    lowerLimit          = -100000.0   # counts (= -100 mm); home zero = centre of travel
    upperLimit          =  100000.0   # counts (=  100 mm)
    indexOffset         =  100000.0   # counts (=  100 mm) — index mark to position-0
    indexSpeed          =  2000.0     # counts/sec (= 2 mm/sec)
    maxSpeed            =  20000.0    # counts/sec (= 20 mm/sec)
    acceleration        =  100000.0   # counts/sec^2 (= 100 mm/sec^2)
    deceleration        =  100000.0   # counts/sec^2 (= 100 mm/sec^2)
    inPositionThreshold =  10.0       # counts (= 0.01 mm)
  }

  # Reserved (inactive) — Steering Beam Splitter / Collimator Unit / Calibration
  # Source Stage. Add blocks + flip activeAxes when those assemblies come online.
}
