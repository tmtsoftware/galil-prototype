# GalilMotion HCD Configuration - SIMULATOR MODE
# Based on SDD Section 4.4, Figure 4-3
#
# Instance-specific parameters for simulator testing without physical hardware.
# This file does NOT define the CSW prefix or component identity — those are
# the responsibility of the container conf (GalilHcd1.conf), which injects
# componentInfo.prefix via the CSW framework.
#
# Usage:
#   Terminal 1: sbt "galil-simulator/run"
#   Terminal 2: ./target/universal/stage/bin/galil-hcd \
#                 -main csw.proto.galil.hcd.GalilHcdApp \
#                 --local galil-hcd/src/main/resources/GalilHcd1.conf \
#                 -Dgalil.config.path=GalilHcdConfig-Simulator.conf

# Controller connection settings
controller {
  # IP address as integer array [a, b, c, d] for a.b.c.d
  # Simulator runs on localhost
  host = [127, 0, 0, 1]
  
  # TCP port for simulator
  # GalilSimulator default port
  port = 8888
  
  # Instance identifier for this Galil controller (0..N, unique per host).
  # HMI port = 9090 + id; id 0 keeps the default simulator on 9090.
  id = 0
  
  # Embedded DMC program file (relative to programs/ resources directory)
  # Not used in simulation mode — program verification is skipped.
  # Specified here only so the config parser doesn't fail; value is ignored.
  embeddedProgram = ""
    
  # QR DataRecord polling rates (Hz)
  # Standby: used when all axes are idle/lost/error
  # Action: used when any axis is homing/moving/tracking
  standbyPollingRateHz = 1.0
  actionPollingRateHz = 10.0
}

# Software-only simulation mode
# true: Connects to GalilSimulator (full init runs against simulator)
# false: Connects to real hardware
simulate = true

# Active axes (8 boolean values for axes A through H)
# A and B: rotating (match hardware). C-H: linear (simulator-only).
# All 8 axes active so the simulator deployment exercises the full
# thread pool, including the thread-0 last-resort lend: 8 concurrent
# motions require threads 1-7 plus thread 0.
activeAxes = [true, true, true, true, true, true, true, true]

# Per-axis configuration
# Motion parameter note:
# In simulator mode there is no real controller to read motion values back from,
# so the values here are the effective motion parameters used for the HCD's
# physics-based timeout calculations.
# Set these to match your intended test scenarios.
axes {
  # Axis A - Rotating Mechanism (matches hardware: rotating, cpr=400)
  A {
    name = "Rotating Test A"
    mechanismType = "rotating"
    upperLimit = 360.0
    lowerLimit = 0.0
    algorithm = "shortest"
    inPositionThreshold = 5.0
    indexOffset = 10.0
    countsPerRevolution = 400   # counts per full revolution — matches hardware
    # Motion parameters (simulator-only effective values)
    maxSpeed     = 1000.0   # counts/sec
    acceleration = 9216.0   # counts/sec²
    deceleration = 9216.0   # counts/sec²
    motionDelay  = 100.0    # ms (post-move settling)
    indexSpeed   = 256.0    # counts/sec (homing speed)
  }
  
  # Axis B - Rotating Mechanism (matches hardware: rotating, cpr=400)
  B {
    name = "Rotating Test B"
    mechanismType = "rotating"
    upperLimit = 360.0
    lowerLimit = 0.0
    algorithm = "shortest"
    inPositionThreshold = 1.0
    indexOffset = 0.0
    countsPerRevolution = 400   # counts per full revolution — matches hardware
    # Motion parameters (simulator-only effective values)
    maxSpeed     = 1000.0   # counts/sec
    acceleration = 9216.0   # counts/sec²
    deceleration = 9216.0   # counts/sec²
    motionDelay  = 100.0    # ms (post-move settling)
    indexSpeed   = 256.0    # counts/sec (homing speed)
  }

  # Axis C - Linear Mechanism (simulator-only, for HMI testing)
  C {
    name = "Linear Test C"
    mechanismType = "linear"
    upperLimit = 10000.0
    lowerLimit = 0.0
    algorithm = "forward"
    inPositionThreshold = 5.0
    indexOffset = 0.0
    # Motion parameters (simulator-only effective values)
    maxSpeed     = 5000.0   # counts/sec
    acceleration = 25000.0  # counts/sec²
    deceleration = 25000.0  # counts/sec²
    motionDelay  = 0.0      # ms (no settling for linear)
    indexSpeed   = 500.0    # counts/sec (homing speed)
  }

  # Axis D - Linear Mechanism (simulator-only, for HMI testing)
  D {
    name = "Linear Test D"
    mechanismType = "linear"
    upperLimit = 50000.0
    lowerLimit = -10000.0
    algorithm = "forward"
    inPositionThreshold = 10.0
    indexOffset = 0.0
    # Motion parameters (simulator-only effective values)
    maxSpeed     = 10000.0  # counts/sec
    acceleration = 50000.0  # counts/sec²
    deceleration = 50000.0  # counts/sec²
    motionDelay  = 0.0      # ms (no settling for linear)
    indexSpeed   = 1000.0   # counts/sec (homing speed)
  }

  # Axes E-H - Linear Mechanisms (simulator-only).
  # Populate the controller to the full 8 axes so simulator testing covers the
  # 8-motor case: 8 simultaneous motions exhaust threads 1-7 and force the
  # thread-0 last-resort lend (S85). Parameters mirror axis D.
  E {
    name = "Linear Test E"
    mechanismType = "linear"
    upperLimit = 50000.0
    lowerLimit = -10000.0
    algorithm = "forward"
    inPositionThreshold = 10.0
    indexOffset = 0.0
    # Motion parameters (simulator-only effective values)
    maxSpeed     = 10000.0  # counts/sec
    acceleration = 50000.0  # counts/sec²
    deceleration = 50000.0  # counts/sec²
    motionDelay  = 0.0      # ms (no settling for linear)
    indexSpeed   = 1000.0   # counts/sec (homing speed)
  }

  F {
    name = "Linear Test F"
    mechanismType = "linear"
    upperLimit = 50000.0
    lowerLimit = -10000.0
    algorithm = "forward"
    inPositionThreshold = 10.0
    indexOffset = 0.0
    # Motion parameters (simulator-only effective values)
    maxSpeed     = 10000.0  # counts/sec
    acceleration = 50000.0  # counts/sec²
    deceleration = 50000.0  # counts/sec²
    motionDelay  = 0.0      # ms (no settling for linear)
    indexSpeed   = 1000.0   # counts/sec (homing speed)
  }

  G {
    name = "Linear Test G"
    mechanismType = "linear"
    upperLimit = 50000.0
    lowerLimit = -10000.0
    algorithm = "forward"
    inPositionThreshold = 10.0
    indexOffset = 0.0
    # Motion parameters (simulator-only effective values)
    maxSpeed     = 10000.0  # counts/sec
    acceleration = 50000.0  # counts/sec²
    deceleration = 50000.0  # counts/sec²
    motionDelay  = 0.0      # ms (no settling for linear)
    indexSpeed   = 1000.0   # counts/sec (homing speed)
  }

  H {
    name = "Linear Test H"
    mechanismType = "linear"
    upperLimit = 50000.0
    lowerLimit = -10000.0
    algorithm = "forward"
    inPositionThreshold = 10.0
    indexOffset = 0.0
    # Motion parameters (simulator-only effective values)
    maxSpeed     = 10000.0  # counts/sec
    acceleration = 50000.0  # counts/sec²
    deceleration = 50000.0  # counts/sec²
    motionDelay  = 0.0      # ms (no settling for linear)
    indexSpeed   = 1000.0   # counts/sec (homing speed)
  }
}